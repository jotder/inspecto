<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 520" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Governance — maker-checker and Action Requests</title><desc>Config changes governed by the Approval Policy are held as Pending Changes for a different approver; outbound calls are Action Requests, always four-eyes, dispatched with bounded retries.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="520" fill="#FFFFFF"/>
<text x="40" y="30" text-anchor="start" font-size="13" fill="#444441">Config changes (base, opt-in per Space)</text>
<rect x="40" y="44" width="200" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="140" y="63" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Author saves config</text>
<text x="140" y="79" text-anchor="middle" font-size="11" fill="#5F5E5A">authoring route</text>
<line x1="240" y1="68" x2="264" y2="68" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="264" y="44" width="200" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="364" y="63" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Approval Policy</text>
<text x="364" y="79" text-anchor="middle" font-size="11" fill="#534AB7">governs this kind?</text>
<line x1="464" y1="68" x2="488" y2="68" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="488" y="44" width="200" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="588" y="63" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Pending Change</text>
<text x="588" y="79" text-anchor="middle" font-size="11" fill="#534AB7">202, written: false</text>
<line x1="688" y1="68" x2="712" y2="68" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="712" y="44" width="188" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="806" y="63" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Different approver</text>
<text x="806" y="79" text-anchor="middle" font-size="11" fill="#534AB7">canApproveChanges</text>
<path d="M806 92 V120 H330 V140" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="40" y="140" width="200" height="46" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="140" y="159" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Applied</text>
<text x="140" y="175" text-anchor="middle" font-size="11" fill="#0F6E56">replayed as the approver</text>
<rect x="260" y="140" width="200" height="46" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="360" y="159" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Declined / expired</text>
<text x="360" y="175" text-anchor="middle" font-size="11" fill="#5F5E5A">nothing written</text>
<rect x="480" y="140" width="200" height="46" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="580" y="159" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Stale</text>
<text x="580" y="175" text-anchor="middle" font-size="11" fill="#5F5E5A">base moved, refused</text>
<rect x="700" y="140" width="200" height="46" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="800" y="159" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Not governed</text>
<text x="800" y="175" text-anchor="middle" font-size="11" fill="#5F5E5A">written directly</text>
<text x="40" y="238" text-anchor="start" font-size="13" fill="#444441">Outbound actions (Action Requests add-on, always four-eyes)</text>
<rect x="40" y="252" width="200" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="140" y="271" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Raised</text>
<text x="140" y="287" text-anchor="middle" font-size="11" fill="#5F5E5A">Incident, Case or Decision Rule</text>
<line x1="240" y1="276" x2="264" y2="276" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="264" y="252" width="200" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="364" y="271" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Pending</text>
<text x="364" y="287" text-anchor="middle" font-size="11" fill="#534AB7">payload fixed at creation</text>
<line x1="464" y1="276" x2="488" y2="276" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="488" y="252" width="200" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="588" y="271" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Approver</text>
<text x="588" y="287" text-anchor="middle" font-size="11" fill="#534AB7">never author or co-author</text>
<line x1="688" y1="276" x2="712" y2="276" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="712" y="252" width="188" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="806" y="271" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Dispatched</text>
<text x="806" y="287" text-anchor="middle" font-size="11" fill="#0F6E56">one idempotency key</text>
<rect x="488" y="318" width="200" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="588" y="337" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">approverCheck</text>
<text x="588" y="353" text-anchor="middle" font-size="11" fill="#5F5E5A">ok · none-eligible · unknown</text>
<rect x="712" y="318" width="188" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="806" y="337" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Succeeded / failed</text>
<text x="806" y="353" text-anchor="middle" font-size="11" fill="#5F5E5A">retry, same key</text>
<line x1="806" y1="300" x2="806" y2="318" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="40" y="404" text-anchor="start" font-size="13" fill="#444441">Dry run (any Job)</text>
<rect x="40" y="418" width="860" height="46" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="470" y="437" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">DryRunServices</text>
<text x="470" y="453" text-anchor="middle" font-size="11" fill="#993C1D">mail, objects, notifications, incidents and link-index record the would-be effect; reads pass through; grants never widen</text>
</svg>
