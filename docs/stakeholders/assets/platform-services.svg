<text x="811.6" y="341" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">alerts</text>
<text x="811.6" y="357" text-anchor="middle" font-size="11" fill="#0F6E56">evaluates</text>
<text x="40" y="412" text-anchor="start" font-size="11" fill="#5F5E5A">Guard: DryRunCoverageTest fails the build if a registered mutating service has no dry-run stand-in.</text>
<text x="40" y="430" text-anchor="start" font-size="11" fill="#5F5E5A">The menu grows by demand only; services never gain scopes, proxies or lifecycle (not a DI framework).</text>
