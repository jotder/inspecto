<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 470" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Platform Services seam</title><desc>Job Types and pack providers declare requires; a filtered grant over the boot-built registry exposes ten services; dry runs substitute every mutating service.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="470" fill="#FFFFFF"/>
<rect x="40" y="30" width="420" height="46" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="250" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Job Type (built-in)</text>
<text x="250" y="65" text-anchor="middle" font-size="11" fill="#5F5E5A">declares requires: [ids]</text>
<rect x="480" y="30" width="420" height="46" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="690" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Pack provider</text>
<text x="690" y="65" text-anchor="middle" font-size="11" fill="#5F5E5A">ServiceLoader, signed, hot-deployed</text>
<line x1="250" y1="76" x2="250" y2="100" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="690" y1="76" x2="690" y2="100" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="140" y="100" width="660" height="46" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="470" y="119" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">JobContext.services()</text>
<text x="470" y="135" text-anchor="middle" font-size="11" fill="#534AB7">flat typed lookup, filtered per consumer; unknown or undeclared ids refused at registration</text>
<line x1="200" y1="146" x2="200" y2="170" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<line x1="560" y1="146" x2="560" y2="170" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="40" y="170" width="300" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="190" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">DryRunServices</text>
<text x="190" y="205" text-anchor="middle" font-size="11" fill="#534AB7">pack stand-in first, then built-in;</text>
<text x="190" y="219" text-anchor="middle" font-size="11" fill="#534AB7">mutating services log, never act</text>
<rect x="360" y="170" width="540" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="630" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">PlatformServiceRegistry</text>
<text x="630" y="205" text-anchor="middle" font-size="11" fill="#534AB7">id → interface → implementation, built at boot;</text>
<text x="630" y="219" text-anchor="middle" font-size="11" fill="#534AB7">pack-contributed services bind under their pack</text>
<line x1="630" y1="220" x2="630" y2="244" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="40" y="244" width="860" height="140" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="48" y="259" font-size="11" fill="#5F5E5A">The ten services bound by the host (read-only ones pass through a dry run unchanged)</text>
<rect x="48.0" y="268" width="160.8" height="44" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="128.4" y="287" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">notifications</text>
