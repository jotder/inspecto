<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 330" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Stage-1 parsing and ingest</title><desc>Inbox files become a Consignment, are parsed, typed and committed as Parquet; bad files go to quarantine.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="330" fill="#FFFFFF"/>
<rect x="20" y="40" width="150" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="95" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Inbox</text>
<text x="95" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">Collector-landed files</text>
<rect x="200" y="40" width="150" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="275" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Unpack</text>
<text x="275" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">Archives -&gt; plain files</text>
<rect x="380" y="40" width="160" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="460" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">ConsignmentPlanner</text>
<text x="460" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">collector.consignment</text>
<rect x="570" y="40" width="160" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="650" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Parse frontend</text>
<text x="650" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">parsing: block</text>
<rect x="760" y="40" width="160" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="840" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Transform + cast</text>
<text x="840" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">SchemaFieldTypes.castSql</text>
<line x1="170" y1="70" x2="200" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="350" y1="70" x2="380" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="540" y1="70" x2="570" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="730" y1="70" x2="760" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="760" y="150" width="160" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="840" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">PartitionWriter</text>
<text x="840" y="185" text-anchor="middle" font-size="11" fill="#0F6E56">stage, atomic rename</text>
<line x1="840" y1="100" x2="840" y2="150" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="540" y="150" width="190" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="635" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Commit</text>
<text x="635" y="185" text-anchor="middle" font-size="11" fill="#0F6E56">manifest, backup,</text>
<text x="635" y="199" text-anchor="middle" font-size="11" fill="#0F6E56">markers, ledger last</text>
<line x1="760" y1="180" x2="730" y2="180" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="280" y="150" width="220" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="390" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Typed Parquet store</text>
<text x="390" y="185" text-anchor="middle" font-size="11" fill="#185FA5">&lt;store&gt;/database/year=/...</text>
<line x1="540" y1="180" x2="500" y2="180" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="250" width="230" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="135" y="269" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Quarantine tree</text>
<text x="135" y="285" text-anchor="middle" font-size="11" fill="#993C1D">&lt;quarantine&gt;/&lt;subpath&gt;/&lt;reason&gt;/</text>
<rect x="280" y="250" width="230" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="395" y="269" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Reject rows</text>
<text x="395" y="285" text-anchor="middle" font-size="11" fill="#993C1D">errors/&lt;base&gt;_errors.csv</text>
<rect x="540" y="250" width="230" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="655" y="269" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Restricted store (opt-in)</text>
<text x="655" y="285" text-anchor="middle" font-size="11" fill="#993C1D">&lt;data root&gt;/.restricted/&lt;pipeline&gt;/</text>
<path d="M 610 100 L 610 125 L 135 125 L 135 250" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<path d="M 650 100 L 650 135 L 395 135 L 395 250" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<path d="M 700 100 L 700 140 L 655 140 L 655 250" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="140" y="240" text-anchor="start" font-size="10" fill="#5F5E5A">unreadable, field_mismatch, empty, retry_exhausted</text>
</svg>
