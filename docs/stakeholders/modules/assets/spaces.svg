<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 400" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Spaces: request path and module gates</title><desc>A request is bound to a Space by the /spaces/{id} prefix, then passes Installed, Enabled and Permitted gates.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="400" fill="#FFFFFF"/>
<rect x="20" y="30" width="180" height="56" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="110" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">HTTP request</text>
<text x="110" y="65" text-anchor="middle" font-size="11" fill="#185FA5">/api/v1/spaces/{id}/...</text>
<rect x="240" y="30" width="200" height="56" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="340" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">ControlApi.dispatch</text>
<text x="340" y="65" text-anchor="middle" font-size="11" fill="#185FA5">strip prefix, bind space MDC</text>
<rect x="480" y="30" width="200" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="580" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">SpaceManager</text>
<text x="580" y="65" text-anchor="middle" font-size="11" fill="#0F6E56">id -&gt; SpaceContext</text>
<rect x="720" y="30" width="200" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="820" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">SpaceContext</text>
<text x="820" y="65" text-anchor="middle" font-size="11" fill="#0F6E56">SpaceRoot + CollectorService</text>
<line x1="200" y1="58" x2="240" y2="58" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="440" y1="58" x2="480" y2="58" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="680" y1="58" x2="720" y2="58" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="120" width="900" height="120" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="28" y="135" font-size="11" fill="#5F5E5A">Three gates (outside feature code)</text>
<rect x="40" y="150" width="260" height="74" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="170" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Installed</text>
<text x="170" y="185" text-anchor="middle" font-size="11" fill="#5F5E5A">module jar on class path?</text>
<text x="170" y="199" text-anchor="middle" font-size="11" fill="#5F5E5A">no: 503 CAPABILITY_UNAVAILABLE</text>
<rect x="340" y="150" width="260" height="74" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="470" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Enabled (per Space)</text>
<text x="470" y="185" text-anchor="middle" font-size="11" fill="#534AB7">modules.toon disabled list</text>
<text x="470" y="199" text-anchor="middle" font-size="11" fill="#534AB7">yes: 404 MODULE_DISABLED</text>
<rect x="640" y="150" width="260" height="74" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="770" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Permitted (RBAC)</text>
<text x="770" y="185" text-anchor="middle" font-size="11" fill="#993C1D">capability e.g. canAdminister</text>
<text x="770" y="199" text-anchor="middle" font-size="11" fill="#993C1D">no: 403 (no Subject: no-op)</text>
<line x1="300" y1="187" x2="340" y2="187" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="600" y1="187" x2="640" y2="187" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="270" width="900" height="110" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="28" y="285" font-size="11" fill="#5F5E5A">Space root on disk (-Dspaces.root)</text>
<rect x="40" y="300" width="260" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="170" y="319" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">spaces/&lt;id&gt;/</text>
<text x="170" y="335" text-anchor="middle" font-size="11" fill="#0F6E56">config/ data/ audit/ duckdb/</text>
<text x="170" y="349" text-anchor="middle" font-size="11" fill="#0F6E56">space.toon</text>
<rect x="340" y="300" width="260" height="64" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="470" y="319" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">spaces/_templates/&lt;id&gt;/</text>
<text x="470" y="335" text-anchor="middle" font-size="11" fill="#534AB7">template.toon + config/ (+ data/)</text>
<rect x="640" y="300" width="260" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="770" y="319" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">SpaceRoot.legacy()</text>
<text x="770" y="335" text-anchor="middle" font-size="11" fill="#5F5E5A">no -Dspaces.root: flat CWD layout</text>
<line x1="340" y1="332" x2="300" y2="332" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
</svg>
