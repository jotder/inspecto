<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 400" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Event log flow</title><desc>Emitters call EventLog.emit; the event is scrubbed, AUDIT and ACCESS_DENIED are hash-chained, appended to the configured EventStore, then handed to subscribers; routes read the store.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="400" fill="#FFFFFF"/>
<rect x="20" y="30" width="200" height="330" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="28" y="45" font-size="11" fill="#5F5E5A">Emitters</text>
<rect x="35" y="55" width="170" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="120" y="74" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Domain emitters</text>
<text x="120" y="90" text-anchor="middle" font-size="11" fill="#5F5E5A">Collectors, jobs, alerts</text>
<rect x="35" y="125" width="170" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="120" y="144" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">EventStoreAppender</text>
<text x="120" y="160" text-anchor="middle" font-size="11" fill="#5F5E5A">SLF4J INFO and above</text>
<rect x="35" y="195" width="170" height="54" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="120" y="214" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Audited mutations</text>
<text x="120" y="230" text-anchor="middle" font-size="11" fill="#993C1D">AUDIT, ACCESS_DENIED</text>
<rect x="250" y="30" width="260" height="330" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="258" y="45" font-size="11" fill="#5F5E5A">EventLog.emit (per Space)</text>
<rect x="265" y="55" width="230" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="380" y="74" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">SecretScrubber.scrub</text>
<text x="380" y="90" text-anchor="middle" font-size="11" fill="#0F6E56">redact secrets in message/attrs</text>
<rect x="265" y="135" width="230" height="54" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="380" y="154" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">AuditChainLinker</text>
<text x="380" y="170" text-anchor="middle" font-size="11" fill="#534AB7">seq, prevHash, SHA-256 hash</text>
<rect x="265" y="215" width="230" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="380" y="234" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">EventStore.append</text>
<text x="380" y="250" text-anchor="middle" font-size="11" fill="#0F6E56">then inspecto_events_total</text>
<rect x="265" y="290" width="230" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="380" y="309" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Subscribers and taps</text>
<text x="380" y="325" text-anchor="middle" font-size="11" fill="#0F6E56">alerts, notifications, probes</text>
<line x1="380" y1="109" x2="380" y2="135" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="384" y="118" text-anchor="start" font-size="10" fill="#5F5E5A">chained types</text>
<line x1="380" y1="189" x2="380" y2="215" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="380" y1="269" x2="380" y2="290" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="205" y1="82" x2="265" y2="82" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="205" y1="152" x2="265" y2="82" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="205" y1="222" x2="265" y2="82" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="540" y="30" width="180" height="330" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="548" y="45" font-size="11" fill="#5F5E5A">events.backend</text>
<rect x="555" y="55" width="150" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="630" y="74" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">memory</text>
<text x="630" y="90" text-anchor="middle" font-size="11" fill="#0F6E56">InMemoryEventStore</text>
<rect x="555" y="135" width="150" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="630" y="154" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">parquet</text>
<text x="630" y="170" text-anchor="middle" font-size="11" fill="#0F6E56">ParquetEventStore</text>
<rect x="555" y="215" width="150" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="630" y="234" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">db / jdbc:</text>
<text x="630" y="250" text-anchor="middle" font-size="11" fill="#0F6E56">DbEventStore</text>
<line x1="495" y1="242" x2="555" y2="162" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="750" y="30" width="170" height="330" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="758" y="45" font-size="11" fill="#5F5E5A">Readers</text>
<rect x="762" y="55" width="146" height="54" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="835" y="74" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">/events*</text>
<text x="835" y="90" text-anchor="middle" font-size="11" fill="#185FA5">EventRoutes</text>
<rect x="762" y="135" width="146" height="54" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="835" y="154" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">/audit/*</text>
<text x="835" y="170" text-anchor="middle" font-size="11" fill="#185FA5">AuditLogRoutes</text>
<rect x="762" y="215" width="146" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="835" y="234" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">event_prune job</text>
<text x="835" y="250" text-anchor="middle" font-size="11" fill="#5F5E5A">retention_days</text>
<line x1="705" y1="162" x2="762" y2="82" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="705" y1="162" x2="762" y2="162" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="705" y1="162" x2="762" y2="242" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
