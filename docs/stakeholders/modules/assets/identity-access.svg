<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 400" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Identity and access request path</title><desc>A request is authenticated by an Authenticator, checked by an optional AccessDecider, then by the route capability gate and the write-root gate.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="400" fill="#FFFFFF"/>
<rect x="20" y="40" width="150" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="95" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Browser / SPA</text>
<text x="95" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">Bearer access token</text>
<rect x="220" y="40" width="170" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="305" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">POST /auth/exchange</text>
<text x="305" y="75" text-anchor="middle" font-size="11" fill="#185FA5">TokenRelay (BFF session)</text>
<rect x="440" y="40" width="230" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="555" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">OidcTokenRelay</text>
<text x="555" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">Keycloak / WSO2 / generic IdP</text>
<rect x="720" y="40" width="200" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="820" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">DemoTokenRelay</text>
<text x="820" y="75" text-anchor="middle" font-size="11" fill="#993C1D">code demo:&lt;id&gt;, loopback only</text>
<line x1="170" y1="70" x2="220" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="390" y1="70" x2="440" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<path d="M390 90 C 560 120, 700 110, 760 100" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect x="20" y="140" width="900" height="120" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="28" y="155" font-size="11" fill="#5F5E5A">ControlApi request gating (in order)</text>
<rect x="40" y="170" width="200" height="70" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="140" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">1 Authenticator</text>
<text x="140" y="205" text-anchor="middle" font-size="11" fill="#0F6E56">JWT or demo token -&gt;</text>
<text x="140" y="219" text-anchor="middle" font-size="11" fill="#0F6E56">Subject (else 401)</text>
<rect x="260" y="170" width="200" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="360" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">2 AccessDecider</text>
<text x="360" y="205" text-anchor="middle" font-size="11" fill="#534AB7">PolicyEngine (Advanced)</text>
<text x="360" y="219" text-anchor="middle" font-size="11" fill="#534AB7">ALLOW / DENY / ABSTAIN</text>
<rect x="480" y="170" width="200" height="70" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="580" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">3 withCapability</text>
<text x="580" y="205" text-anchor="middle" font-size="11" fill="#0F6E56">role -&gt; capabilities</text>
<text x="580" y="219" text-anchor="middle" font-size="11" fill="#0F6E56">(else 403)</text>
<rect x="700" y="170" width="200" height="70" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="800" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">4 WriteGates</text>
<text x="800" y="205" text-anchor="middle" font-size="11" fill="#0F6E56">no write root -&gt; 503</text>
<line x1="240" y1="205" x2="260" y2="205" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="460" y1="205" x2="480" y2="205" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="680" y1="205" x2="700" y2="205" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="95" y1="100" x2="140" y2="170" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="40" y="300" width="200" height="70" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="140" y="319" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">roles.toon</text>
<text x="140" y="335" text-anchor="middle" font-size="11" fill="#5F5E5A">authored roles over the</text>
<text x="140" y="349" text-anchor="middle" font-size="11" fill="#5F5E5A">Roles.SEED table</text>
<rect x="260" y="300" width="200" height="70" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="360" y="319" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">access-policies.toon</text>
<text x="360" y="335" text-anchor="middle" font-size="11" fill="#5F5E5A">deny overrides; unreadable</text>
<text x="360" y="349" text-anchor="middle" font-size="11" fill="#5F5E5A">-&gt; deny all</text>
<rect x="480" y="300" width="200" height="70" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="580" y="319" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Access Profiles</text>
<text x="580" y="335" text-anchor="middle" font-size="11" fill="#5F5E5A">component store:</text>
<text x="580" y="349" text-anchor="middle" font-size="11" fill="#5F5E5A">access-profile denials</text>
<rect x="700" y="300" width="200" height="70" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="800" y="319" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">SecretResolver</text>
<text x="800" y="335" text-anchor="middle" font-size="11" fill="#5F5E5A">ENV / SYS core; FILE /</text>
<text x="800" y="349" text-anchor="middle" font-size="11" fill="#5F5E5A">KEYSTORE via inspecto-secrets</text>
<line x1="140" y1="300" x2="140" y2="240" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<line x1="360" y1="300" x2="360" y2="240" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<line x1="580" y1="300" x2="580" y2="240" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
