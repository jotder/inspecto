<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 320" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Pipelines and Steps</title><desc>The editor graph lowers to a *_pipeline.toon; the ingest lane and the at-rest lane execute its Steps.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="320" fill="#FFFFFF"/>
<rect x="20" y="40" width="190" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="115" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Pipeline editor</text>
<text x="115" y="75" text-anchor="middle" font-size="11" fill="#185FA5">palette: node-types,</text>
<text x="115" y="89" text-anchor="middle" font-size="11" fill="#185FA5">processor-catalog</text>
