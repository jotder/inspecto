<text x="580" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">&lt;id&gt;_pipeline.toon</text>
<text x="580" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">canonical config</text>
