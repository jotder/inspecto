<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 310" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Storage classes</title><desc>Three data classes per Space: business data as Parquet, configuration as TOON with history, operational data in DuckDB or Postgres.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="310" fill="#FFFFFF"/>
<rect x="330" y="20" width="280" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="470" y="39" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Space root (DirSpaceRoot)</text>
<text x="470" y="55" text-anchor="middle" font-size="11" fill="#5F5E5A">spaces/&lt;id&gt;/</text>
<rect x="20" y="110" width="280" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="160" y="129" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Business data</text>
<text x="160" y="145" text-anchor="middle" font-size="11" fill="#0F6E56">data/&lt;store&gt;/database/**</text>
<text x="160" y="159" text-anchor="middle" font-size="11" fill="#0F6E56">Hive-partitioned Parquet</text>
<rect x="330" y="110" width="280" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="470" y="129" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Configuration</text>
<text x="470" y="145" text-anchor="middle" font-size="11" fill="#0F6E56">config/**/*.toon</text>
<text x="470" y="159" text-anchor="middle" font-size="11" fill="#0F6E56">.history/ snapshots</text>
<rect x="640" y="110" width="280" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="780" y="129" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Operational data</text>
<text x="780" y="145" text-anchor="middle" font-size="11" fill="#0F6E56">duckdb/&lt;family&gt;.db</text>
<text x="780" y="159" text-anchor="middle" font-size="11" fill="#0F6E56">or Postgres by selection</text>
<line x1="470" y1="70" x2="160" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="470" y1="70" x2="470" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="470" y1="70" x2="780" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="230" width="135" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="87.5" y="249" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Sinks</text>
<text x="87.5" y="265" text-anchor="middle" font-size="11" fill="#185FA5">sinks[], DuckLake</text>
<rect x="165" y="230" width="135" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="232.5" y="249" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Reads</text>
<text x="232.5" y="265" text-anchor="middle" font-size="11" fill="#185FA5">SqlViews</text>
<rect x="330" y="230" width="280" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="470" y="249" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">ComponentStore</text>
<text x="470" y="265" text-anchor="middle" font-size="11" fill="#185FA5">ConfigSafetyValidator on write</text>
<rect x="640" y="230" width="280" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="780" y="249" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">ServiceStores, OperationalDb</text>
<text x="780" y="265" text-anchor="middle" font-size="11" fill="#185FA5">one file per family</text>
<line x1="87" y1="230" x2="87" y2="190" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="232" y1="190" x2="232" y2="230" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="470" y1="230" x2="470" y2="190" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="780" y1="230" x2="780" y2="190" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
</svg>
