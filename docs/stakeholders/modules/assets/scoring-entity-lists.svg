<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 430" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Risk Score to watch-list entry</title><desc>risk.score run feeding a watch Entity List, and the life of one list entry.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="430" fill="#FFFFFF"/>
<text x="470" y="24" text-anchor="middle" font-size="13" fill="#444441">Risk Score run feeding an Entity List, and one entry's life</text>
<rect x="20" y="50" width="190" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="115" y="69" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">risk.score Job</text>
<text x="115" y="85" text-anchor="middle" font-size="11" fill="#0F6E56">factors -&gt; score 0..100</text>
<rect x="20" y="160" width="190" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="115" y="179" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">high entity</text>
<text x="115" y="195" text-anchor="middle" font-size="11" fill="#993C1D">score &gt;= highThreshold</text>
<rect x="20" y="270" width="190" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="115" y="289" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Manual change</text>
<text x="115" y="305" text-anchor="middle" font-size="11" fill="#5F5E5A">POST .../members</text>
<rect x="290" y="270" width="190" height="64" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="385" y="289" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Held (Pending Change)</text>
<text x="385" y="305" text-anchor="middle" font-size="11" fill="#534AB7">four-eyes policy, 202</text>
<rect x="560" y="50" width="170" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="645" y="69" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Expiring member</text>
<text x="645" y="85" text-anchor="middle" font-size="11" fill="#534AB7">expiresAt set</text>
<rect x="560" y="170" width="170" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="645" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Permanent member</text>
<text x="645" y="205" text-anchor="middle" font-size="11" fill="#534AB7">matches</text>
<rect x="780" y="50" width="140" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="850" y="69" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Expired</text>
<text x="850" y="85" text-anchor="middle" font-size="11" fill="#5F5E5A">kept, stops matching</text>
<rect x="780" y="170" width="140" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="850" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Removed</text>
<text x="850" y="205" text-anchor="middle" font-size="11" fill="#5F5E5A">fact appended</text>
<rect x="560" y="330" width="170" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="645" y="349" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">List retired</text>
<text x="645" y="365" text-anchor="middle" font-size="11" fill="#993C1D">matches nothing</text>
<line x1="115" y1="114" x2="115" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="210" y1="180" x2="560" y2="85" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="389" y="128.5" text-anchor="start" font-size="10" fill="#5F5E5A">feed: expires in ttlHours (no hold)</text>
<line x1="115" y1="216" x2="115" y2="270" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<line x1="210" y1="298" x2="290" y2="298" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="254" y="294" text-anchor="start" font-size="10" fill="#5F5E5A">policy on</text>
<line x1="480" y1="290" x2="560" y2="210" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="524" y="246" text-anchor="start" font-size="10" fill="#5F5E5A">approved</text>
<path d="M 210 285 L 250 285 L 250 200 L 560 200" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="258" y="225" text-anchor="start" font-size="10" fill="#5F5E5A">no policy, or add-only expiring &lt; 24 h</text>
<line x1="730" y1="78" x2="780" y2="78" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="759" y="74" text-anchor="start" font-size="10" fill="#5F5E5A">time passes</text>
<line x1="645" y1="106" x2="645" y2="170" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="649" y="134" text-anchor="start" font-size="10" fill="#5F5E5A">permanent add</text>
<line x1="730" y1="198" x2="780" y2="198" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="759" y="194" text-anchor="start" font-size="10" fill="#5F5E5A">remove</text>
<line x1="645" y1="226" x2="645" y2="330" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="649" y="274" text-anchor="start" font-size="10" fill="#5F5E5A">retire</text>
<text x="20" y="415" text-anchor="start" font-size="10" fill="#5F5E5A">Every change is a fact in the hash-chained EntityFactLog; the Parquet sidecar entity_list_&lt;id&gt; is rewritten after each write.</text>
</svg>
