<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 320" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Jobs and scheduler</title><desc>Four trigger modes reach JobService, which resolves parameters, bounds concurrency and runs a Job Type; a dry run swaps Platform Services for stand-ins.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="320" fill="#FFFFFF"/>
<rect x="20" y="30" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="110" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Cron</text>
<text x="110" y="65" text-anchor="middle" font-size="11" fill="#5F5E5A">cron: on Scheduler</text>
<line x1="200" y1="58" x2="250" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="98" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="110" y="117" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">on_pipeline</text>
<text x="110" y="133" text-anchor="middle" font-size="11" fill="#5F5E5A">Consignment committed</text>
<line x1="200" y1="126" x2="250" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="166" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="110" y="185" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">on_signal</text>
<text x="110" y="201" text-anchor="middle" font-size="11" fill="#5F5E5A">Signal + when: guard</text>
<line x1="200" y1="194" x2="250" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="234" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="110" y="253" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Manual</text>
<text x="110" y="269" text-anchor="middle" font-size="11" fill="#5F5E5A">POST /jobs/{name}/trigger</text>
<line x1="200" y1="262" x2="250" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="250" y="120" width="190" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="345" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">JobService</text>
<text x="345" y="155" text-anchor="middle" font-size="11" fill="#0F6E56">ParameterResolver</text>
<text x="345" y="169" text-anchor="middle" font-size="11" fill="#0F6E56">runPermits (default 4)</text>
<rect x="480" y="120" width="190" height="80" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="575" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Job Type</text>
<text x="575" y="155" text-anchor="middle" font-size="11" fill="#0F6E56">JobTypeRegistry: builtin,</text>
<text x="575" y="169" text-anchor="middle" font-size="11" fill="#0F6E56">classpath, pack:&lt;owner&gt;</text>
<line x1="440" y1="160" x2="480" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="720" y="40" width="200" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="820" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Platform Services</text>
<text x="820" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">granted by requires:</text>
<rect x="720" y="130" width="200" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="820" y="149" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">DryRunServices</text>
<text x="820" y="165" text-anchor="middle" font-size="11" fill="#993C1D">stand-ins record only</text>
<rect x="720" y="220" width="200" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="820" y="239" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Run Log + Artifacts</text>
<text x="820" y="255" text-anchor="middle" font-size="11" fill="#185FA5">jobs_runs.csv, Signals</text>
<line x1="670" y1="140" x2="720" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="670" y1="160" x2="720" y2="160" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="699" y="156" text-anchor="start" font-size="10" fill="#5F5E5A">dryRun</text>
<line x1="670" y1="180" x2="720" y2="250" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
</svg>
