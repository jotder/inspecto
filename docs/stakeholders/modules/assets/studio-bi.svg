<rect x="0" y="0" width="940" height="290" fill="#FFFFFF"/>
<rect x="20" y="40" width="180" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="110" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Dataset</text>
