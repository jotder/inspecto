<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 290" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Studio BI result path</title><desc>A Widget of a Visualization Type builds a QuerySpec over a Dataset; MeasureCompiler compiles one guarded SELECT.</desc>
