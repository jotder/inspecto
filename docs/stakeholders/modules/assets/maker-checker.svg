<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 300" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Pending Change lifecycle</title><desc>An authoring route holds a governed write as a Pending Change; a different approver replays it or it closes.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="300" fill="#FFFFFF"/>
<rect x="20" y="40" width="150" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="95" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Maker</text>
<text x="95" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">authoring route</text>
<rect x="210" y="40" width="170" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="295" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">PendingChanges.hold</text>
<text x="295" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">after all gates</text>
<rect x="420" y="40" width="150" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="495" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">pending</text>
<text x="495" y="75" text-anchor="middle" font-size="11" fill="#534AB7">202, nothing written</text>
<rect x="610" y="40" width="150" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="685" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Checker</text>
<text x="685" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">canApproveChanges</text>
<rect x="780" y="40" width="140" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="850" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">replay</text>
<text x="850" y="75" text-anchor="middle" font-size="11" fill="#185FA5">every gate reruns</text>
<line x1="170" y1="70" x2="210" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="380" y1="70" x2="420" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="570" y1="70" x2="610" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="760" y1="70" x2="780" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="210" y="170" width="170" height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="295" y="200" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">no rule for kind</text>
<path d="M295 100 L295 170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="300" y="140" text-anchor="start" font-size="10" fill="#5F5E5A">policy off: write now</text>
<rect x="420" y="230" width="94" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="467" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">approved</text>
<rect x="522" y="230" width="94" height="40" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="569" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">stale (409)</text>
<rect x="624" y="230" width="94" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="671" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">declined</text>
<rect x="726" y="230" width="94" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="773" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">withdrawn</text>
<rect x="828" y="230" width="94" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="875" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">expired</text>
<path d="M850 100 L850 140 L467 140 L467 230" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="560" y="134" text-anchor="start" font-size="10" fill="#5F5E5A">base version unchanged / changed</text>
</svg>
