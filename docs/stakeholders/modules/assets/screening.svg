<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 300" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Screening: check, run, review</title><desc>Subjects are matched against Entity Lists; a run raises signed hits; a confirm opens an Incident and a Case.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="300" fill="#FFFFFF"/>
<rect x="20" y="40" width="170" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="105" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Analyst / caller</text>
<text x="105" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">POST /screening/check</text>
<rect x="20" y="160" width="170" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="105" y="179" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Dataset rows</text>
<text x="105" y="195" text-anchor="middle" font-size="11" fill="#0F6E56">screening.run Job</text>
<rect x="250" y="100" width="190" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="345" y="119" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Screener</text>
<text x="345" y="135" text-anchor="middle" font-size="11" fill="#534AB7">identifier match 1.0</text>
<text x="345" y="149" text-anchor="middle" font-size="11" fill="#534AB7">NameMatcher score 0..1</text>
<rect x="250" y="220" width="190" height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="345" y="239" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Entity Lists</text>
<text x="345" y="255" text-anchor="middle" font-size="11" fill="#0F6E56">LIVE members only</text>
<rect x="500" y="40" width="180" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="590" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Match results</text>
<text x="590" y="75" text-anchor="middle" font-size="11" fill="#185FA5">nothing persisted</text>
<rect x="500" y="160" width="180" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="590" y="179" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Screening Hits</text>
<text x="590" y="195" text-anchor="middle" font-size="11" fill="#534AB7">signed JSON per hit</text>
<text x="590" y="209" text-anchor="middle" font-size="11" fill="#534AB7">screening-hits/&lt;id&gt;.json</text>
<rect x="740" y="100" width="180" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="830" y="119" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Decide</text>
<text x="830" y="135" text-anchor="middle" font-size="11" fill="#993C1D">confirm | dismiss | escalate</text>
<rect x="740" y="210" width="180" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="830" y="229" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Incident + Case</text>
<text x="830" y="245" text-anchor="middle" font-size="11" fill="#0F6E56">opened on confirm</text>
<line x1="190" y1="70" x2="250" y2="125" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="190" y1="190" x2="250" y2="150" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="345" y1="220" x2="345" y2="170" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<line x1="440" y1="120" x2="500" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="440" y1="150" x2="500" y2="190" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="474" y="166" text-anchor="start" font-size="10" fill="#5F5E5A">&gt;= threshold</text>
<line x1="680" y1="190" x2="740" y2="135" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="830" y1="160" x2="830" y2="210" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
</svg>
