<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 400" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Collector acquire cycle</title><desc>A Collector bound to one Connection discovers, gates, dedups, fetches to staging, lands into the inbox, then ingest takes over.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="400" fill="#FFFFFF"/>
<rect x="20" y="30" width="200" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="120" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Remote system</text>
<text x="120" y="65" text-anchor="middle" font-size="11" fill="#5F5E5A">SFTP / FTP / DB / S3 / Kafka</text>
<rect x="20" y="130" width="200" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="120" y="149" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Connection</text>
<text x="120" y="165" text-anchor="middle" font-size="11" fill="#185FA5">*_connection.toon</text>
<rect x="20" y="230" width="200" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="120" y="249" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Collector</text>
<text x="120" y="265" text-anchor="middle" font-size="11" fill="#185FA5">collector: block in Pipeline</text>
<line x1="120" y1="230" x2="120" y2="190" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="120" y1="130" x2="120" y2="90" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="250" y="20" width="670" height="290" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="258" y="35" font-size="11" fill="#5F5E5A">CollectorProcessor.acquire (inspecto-acquire SPI + connectors)</text>
<rect x="265" y="50" width="148" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="339" y="69" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">A. Discover</text>
<text x="339" y="85" text-anchor="middle" font-size="11" fill="#0F6E56">include / exclude</text>
<rect x="427" y="50" width="148" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="501" y="69" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">B. Stability</text>
<text x="501" y="85" text-anchor="middle" font-size="11" fill="#0F6E56">StabilityGate</text>
<line x1="413" y1="80" x2="427" y2="80" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="589" y="50" width="148" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="663" y="69" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">C. Dedup</text>
<text x="663" y="85" text-anchor="middle" font-size="11" fill="#0F6E56">AcquisitionLedger</text>
<line x1="575" y1="80" x2="589" y2="80" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="751" y="50" width="148" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="825" y="69" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">D. Gaps</text>
<text x="825" y="85" text-anchor="middle" font-size="11" fill="#0F6E56">GapDetector</text>
<line x1="737" y1="80" x2="751" y2="80" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="265" y="150" width="310" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="420" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">E. Fetch to staging</text>
<text x="420" y="185" text-anchor="middle" font-size="11" fill="#0F6E56">RetrievalPlanner, IntegrityChecker</text>
<rect x="595" y="150" width="310" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="750" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Land (atomic rename)</text>
<text x="750" y="185" text-anchor="middle" font-size="11" fill="#0F6E56">staging_dir -&gt; dirs.poll inbox</text>
<line x1="575" y1="180" x2="595" y2="180" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<path d="M 832 110 L 832 130 L 420 130 L 420 150" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="265" y="235" width="640" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="585" y="254" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">F. Retry, circuit breaker, post_action</text>
<text x="585" y="270" text-anchor="middle" font-size="11" fill="#993C1D">RetryPolicy, CircuitBreaker; RETAIN / DELETE / MOVE / RENAME / TAG after land</text>
<line x1="220" y1="60" x2="265" y2="80" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect x="595" y="330" width="310" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="750" y="360" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Ingest (parsing-ingest)</text>
<line x1="750" y1="210" x2="750" y2="235" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="750" y1="295" x2="750" y2="330" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
</svg>
