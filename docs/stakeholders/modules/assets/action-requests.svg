<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 300" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Action Request lifecycle</title><desc>Raised from an Incident or Case, approved by a non-maker, dispatched with retries under one idempotency key.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="300" fill="#FFFFFF"/>
<rect x="20" y="40" width="160" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="100" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Worker / rule</text>
<text x="100" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">create or invoke-api</text>
<rect x="220" y="40" width="150" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="295" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">pending</text>
<text x="295" y="75" text-anchor="middle" font-size="11" fill="#534AB7">approverCheck live</text>
<rect x="410" y="40" width="150" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="485" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Approver</text>
<text x="485" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">four-eyes, roster</text>
<rect x="600" y="40" width="150" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="675" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">dispatched</text>
<text x="675" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">egress check</text>
<rect x="790" y="40" width="130" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="855" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Connection</text>
<text x="855" y="75" text-anchor="middle" font-size="11" fill="#185FA5">https, pinned</text>
<line x1="180" y1="70" x2="220" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="370" y1="70" x2="410" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="560" y1="70" x2="600" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="750" y1="70" x2="790" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="600" y="180" width="150" height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="675" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">succeeded</text>
<rect x="790" y="180" width="130" height="50" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="855" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">failed</text>
<rect x="220" y="180" width="150" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="295" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">declined / expired</text>
<line x1="675" y1="100" x2="675" y2="180" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="720" y1="100" x2="840" y2="180" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="295" y1="100" x2="295" y2="180" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<path d="M855 230 L855 265 L640 265 L640 100" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="660" y="260" text-anchor="start" font-size="10" fill="#5F5E5A">retry: same Idempotency-Key</text>
</svg>
