<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 280" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Exchange: offer, grant, consume</title><desc>An owner Space offers an item; a consumer requests; an active grant makes shared/&lt;owner&gt;/&lt;item&gt; resolve to a published snapshot.</desc>
