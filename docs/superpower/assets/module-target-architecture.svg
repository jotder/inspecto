<svg width="100%" viewBox="0 0 680 820" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Inspecto target module architecture</title><desc>An Offering composes a tier, add-ons, function packs and industry packs. Industry and function packs sit on domain-neutral add-ons, which sit on the platform base (events, alerts, decision kernel, notifications, maker-checker, control plane, engine, scheduler, studio, activator), which sits on contracts, providers and the foundation. Incidents is an add-on from Professional up; Case management requires it.</desc>
