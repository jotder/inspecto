<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 400" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Case lifecycle</title><desc>Built-in CASE workflow (Workflow.defaultFor) plus the merge and split edges of CaseOperations.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="400" fill="#FFFFFF"/>
<text x="470" y="24" text-anchor="middle" font-size="13" fill="#444441">Built-in CASE workflow and administrative edges</text>
<rect x="20" y="70" width="180" height="72" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="110" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Openers</text>
<text x="110" y="105" text-anchor="middle" font-size="11" fill="#5F5E5A">Case Rule, from-entities,</text>
<text x="110" y="119" text-anchor="middle" font-size="11" fill="#5F5E5A">POST /objects, split</text>
<rect x="250" y="80" width="140" height="52" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="320" y="99" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">OPEN</text>
<text x="320" y="115" text-anchor="middle" font-size="11" fill="#534AB7">initial</text>
<rect x="440" y="80" width="160" height="52" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="520" y="111" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">INVESTIGATING</text>
<rect x="440" y="240" width="160" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="520" y="271" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">ESCALATED</text>
<rect x="660" y="80" width="130" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="725" y="111" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">RESOLVED</text>
<rect x="660" y="240" width="130" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="725" y="259" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">CLOSED</text>
<text x="725" y="275" text-anchor="middle" font-size="11" fill="#5F5E5A">terminal</text>
<line x1="200" y1="106" x2="250" y2="106" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="390" y1="106" x2="440" y2="106" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="419" y="102" text-anchor="start" font-size="10" fill="#5F5E5A">investigate</text>
<line x1="520" y1="132" x2="520" y2="240" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="524" y="182" text-anchor="start" font-size="10" fill="#5F5E5A">escalate</text>
<line x1="600" y1="106" x2="660" y2="106" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="634" y="102" text-anchor="start" font-size="10" fill="#5F5E5A">resolve</text>
<line x1="600" y1="258" x2="690" y2="132" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="649" y="191" text-anchor="start" font-size="10" fill="#5F5E5A">resolve</text>
<line x1="740" y1="132" x2="740" y2="240" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="744" y="182" text-anchor="start" font-size="10" fill="#5F5E5A">close</text>
<path d="M 320 132 L 320 330 L 725 330 L 725 292" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="330" y="322" text-anchor="start" font-size="10" fill="#5F5E5A">merge: source Case goes straight to CLOSED (mergedInto, MERGED_INTO link)</text>
<text x="20" y="380" text-anchor="start" font-size="10" fill="#5F5E5A">Split opens a new Case in OPEN with a SPLIT_FROM link; the original keeps its state. No reopen transition exists for a Case.</text>
</svg>
