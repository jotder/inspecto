<rect x="460" y="380" width="180" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="550" y="403" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Report Job</text>
