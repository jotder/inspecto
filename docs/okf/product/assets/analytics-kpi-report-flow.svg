<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 500" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>From ingest to KPI and Report</title><desc>A Collector feeds a Pipeline that writes Datasets. Pipeline Steps call the Analytics kernel. Datasets feed the SQL path, which serves Queries, Measures, Widgets and Dashboards. Scheduled Jobs run Pipelines and call the analytics Platform Service; the Report Job renders a Dashboard to CSV, PDF or PNG.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="500" fill="#FFFFFF"/>
<rect x="40" y="40" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="130" y="63" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Collector</text>
<text x="130" y="80" text-anchor="middle" font-size="11" fill="#5F5E5A">files, databases, streams</text>
<rect x="250" y="40" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="340" y="63" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Pipeline</text>
<text x="340" y="80" text-anchor="middle" font-size="11" fill="#5F5E5A">parse → Steps</text>
<rect x="460" y="40" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="550" y="63" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Datasets</text>
<text x="550" y="80" text-anchor="middle" font-size="11" fill="#5F5E5A">and Derived Tables</text>
<line x1="220" y1="68" x2="248" y2="68" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="430" y1="68" x2="458" y2="68" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="340" y1="96" x2="340" y2="138" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="550" y1="96" x2="550" y2="138" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<path d="M200 140 L200 118 L300 118 L300 98" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
