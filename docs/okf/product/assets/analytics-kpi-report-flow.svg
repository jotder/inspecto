<text x="130" y="162" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Scheduled Jobs</text>
<text x="130" y="180" text-anchor="middle" font-size="11" fill="#993C1D">PIPELINE · ENRICH</text>
<text x="130" y="196" text-anchor="middle" font-size="11" fill="#993C1D">kpi.completeness</text>
<rect x="250" y="140" width="180" height="72" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="340" y="162" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Analytics kernel</text>
<text x="340" y="180" text-anchor="middle" font-size="11" fill="#534AB7">via transform.* Steps</text>
<text x="340" y="196" text-anchor="middle" font-size="11" fill="#534AB7">forecasts, baselines</text>
<rect x="460" y="140" width="180" height="72" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="550" y="162" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">SQL path</text>
<text x="550" y="180" text-anchor="middle" font-size="11" fill="#534AB7">SqlBuilder · SqlViews · SqlGuard</text>
<text x="550" y="196" text-anchor="middle" font-size="11" fill="#534AB7">runs on DuckDB</text>
