<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 260" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Regulatory Reporting lifecycle</title><desc>A template renders a Case or Incident once at draft; four-eyes approval submits the fixed bytes to a jailed file drop.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="260" fill="#FFFFFF"/>
<rect x="20" y="30" width="170" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="105" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Case / Incident</text>
<text x="105" y="65" text-anchor="middle" font-size="11" fill="#0F6E56">subject + member Incidents</text>
<rect x="20" y="140" width="170" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="105" y="159" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Report Template</text>
<text x="105" y="175" text-anchor="middle" font-size="11" fill="#5F5E5A">xml | csv | json</text>
<rect x="250" y="80" width="170" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="335" y="99" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">ReportRenderer</text>
<text x="335" y="115" text-anchor="middle" font-size="11" fill="#534AB7">render once at draft</text>
<text x="335" y="129" text-anchor="middle" font-size="11" fill="#534AB7">refuse, never truncate</text>
<rect x="480" y="30" width="130" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="545" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">draft</text>
<text x="545" y="65" text-anchor="middle" font-size="11" fill="#185FA5">maker</text>
<rect x="480" y="120" width="130" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="545" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">pending</text>
<text x="545" y="155" text-anchor="middle" font-size="11" fill="#185FA5">request-approval</text>
<rect x="670" y="30" width="120" height="50" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="730" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">approve</text>
<text x="730" y="65" text-anchor="middle" font-size="11" fill="#993C1D">checker</text>
<rect x="670" y="120" width="120" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="730" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">decline</text>
<text x="730" y="155" text-anchor="middle" font-size="11" fill="#5F5E5A">checker</text>
<rect x="810" y="30" width="115" height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="867.5" y="49" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">FileDrop</text>
<text x="867.5" y="65" text-anchor="middle" font-size="11" fill="#0F6E56">atomic, once</text>
<rect x="810" y="140" width="115" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="867.5" y="159" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">submitted</text>
<text x="867.5" y="175" text-anchor="middle" font-size="11" fill="#5F5E5A">or failed: retry</text>
<line x1="190" y1="60" x2="250" y2="105" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="190" y1="170" x2="250" y2="130" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="420" y1="100" x2="480" y2="55" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="545" y1="80" x2="545" y2="120" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="610" y1="140" x2="670" y2="60" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="610" y1="150" x2="670" y2="145" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="790" y1="55" x2="810" y2="55" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="867" y1="80" x2="867" y2="140" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
</svg>
