<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 420" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Reconciliation Break lifecycle</title><desc>States of one recorded Break (ReconBreaks.merge and POST /recon/{id}/breaks/status).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="420" fill="#FFFFFF"/>
<text x="470" y="24" text-anchor="middle" font-size="13" fill="#444441">Break lifecycle (one record per pair + type + key + column)</text>
<rect x="20" y="170" width="150" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="95" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Run records</text>
<text x="95" y="205" text-anchor="middle" font-size="11" fill="#5F5E5A">new Break found</text>
<rect x="240" y="70" width="170" height="64" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="325" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">open</text>
<text x="325" y="105" text-anchor="middle" font-size="11" fill="#534AB7">firstSeenAt stamped</text>
<rect x="240" y="280" width="170" height="64" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="325" y="299" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">assigned</text>
<text x="325" y="315" text-anchor="middle" font-size="11" fill="#534AB7">carries assignee</text>
<rect x="500" y="170" width="170" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="585" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">resolved</text>
<text x="585" y="205" text-anchor="middle" font-size="11" fill="#0F6E56">note kept</text>
<rect x="740" y="170" width="180" height="64" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="830" y="189" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">auto_closed</text>
<text x="830" y="205" text-anchor="middle" font-size="11" fill="#993C1D">absentRuns counted</text>
<rect x="740" y="330" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="830" y="349" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">dropped</text>
<text x="830" y="365" text-anchor="middle" font-size="11" fill="#5F5E5A">gone 3 runs</text>
<line x1="170" y1="198" x2="240" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="325" y1="134" x2="325" y2="280" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="329" y="203" text-anchor="start" font-size="10" fill="#5F5E5A">assign</text>
<path d="M 305 280 L 305 134" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="250" y="210" text-anchor="start" font-size="10" fill="#5F5E5A">open (clears</text>
<text x="250" y="222" text-anchor="start" font-size="10" fill="#5F5E5A">assignee)</text>
<line x1="410" y1="110" x2="500" y2="190" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="459" y="146" text-anchor="start" font-size="10" fill="#5F5E5A">resolve</text>
<line x1="410" y1="312" x2="500" y2="220" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="459" y="262" text-anchor="start" font-size="10" fill="#5F5E5A">resolve</text>
<path d="M 585 170 L 585 50 L 300 50 L 300 70" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="430" y="44" text-anchor="start" font-size="10" fill="#5F5E5A">re-open (status open)</text>
<line x1="670" y1="202" x2="740" y2="202" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="709" y="198" text-anchor="start" font-size="10" fill="#5F5E5A">absent</text>
<path d="M 410 90 L 830 90 L 830 170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="600" y="84" text-anchor="start" font-size="10" fill="#5F5E5A">absent from a recorded run</text>
<path d="M 830 234 L 830 260 L 410 300" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="560" y="262" text-anchor="start" font-size="10" fill="#5F5E5A">reappears with assignee (recurrence)</text>
<path d="M 790 170 L 790 140 L 410 125" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="560" y="132" text-anchor="start" font-size="10" fill="#5F5E5A">reappears (recurrence)</text>
<line x1="830" y1="234" x2="830" y2="330" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="834" y="278" text-anchor="start" font-size="10" fill="#5F5E5A">absentRuns = 3</text>
<text x="20" y="405" text-anchor="start" font-size="10" fill="#5F5E5A">Transitions on a run come from ReconBreaks.merge (POST /recon/{id}/record or the recon.run Job); assign / resolve / open come from POST /recon/{id}/breaks/status.</text>
</svg>
