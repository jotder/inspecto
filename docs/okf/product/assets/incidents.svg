<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 380" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Incident lifecycle</title><desc>Built-in INCIDENT workflow from Workflow.defaultFor (states and actions).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="380" fill="#FFFFFF"/>
<text x="470" y="24" text-anchor="middle" font-size="13" fill="#444441">Built-in INCIDENT workflow (Workflow.defaultFor)</text>
<rect x="20" y="150" width="170" height="72" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="105" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Openers</text>
<text x="105" y="185" text-anchor="middle" font-size="11" fill="#5F5E5A">Alert, recon, Job,</text>
<text x="105" y="199" text-anchor="middle" font-size="11" fill="#5F5E5A">Decision Rule, API</text>
<rect x="250" y="150" width="150" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="325" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">IDENTIFIED</text>
<text x="325" y="185" text-anchor="middle" font-size="11" fill="#534AB7">initial</text>
<rect x="470" y="60" width="150" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="545" y="93" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">DIAGNOSING</text>
<rect x="470" y="240" width="150" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="545" y="259" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">RESOLVED</text>
<text x="545" y="275" text-anchor="middle" font-size="11" fill="#0F6E56">SLA clock stops</text>
<rect x="730" y="150" width="170" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="815" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">ARCHIVED</text>
<text x="815" y="185" text-anchor="middle" font-size="11" fill="#993C1D">terminal</text>
<line x1="190" y1="186" x2="250" y2="178" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="400" y1="165" x2="470" y2="95" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="439" y="126" text-anchor="start" font-size="10" fill="#5F5E5A">accept</text>
<line x1="400" y1="192" x2="470" y2="262" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="439" y="223" text-anchor="start" font-size="10" fill="#5F5E5A">resolve</text>
<line x1="530" y1="116" x2="530" y2="240" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="534" y="174" text-anchor="start" font-size="10" fill="#5F5E5A">resolve</text>
<path d="M 570 240 L 570 116" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="578" y="180" text-anchor="start" font-size="10" fill="#5F5E5A">reopen</text>
<line x1="400" y1="178" x2="730" y2="178" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="569" y="174" text-anchor="start" font-size="10" fill="#5F5E5A">archive</text>
<line x1="620" y1="88" x2="760" y2="150" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="694" y="115" text-anchor="start" font-size="10" fill="#5F5E5A">archive</text>
<line x1="620" y1="268" x2="760" y2="206" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="694" y="233" text-anchor="start" font-size="10" fill="#5F5E5A">archive</text>
<path d="M 815 150 L 815 40 L 545 40 L 545 60" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="640" y="34" text-anchor="start" font-size="10" fill="#5F5E5A">reopen (clears closedAt)</text>
<text x="20" y="345" text-anchor="start" font-size="10" fill="#5F5E5A">Actions arrive via POST /objects/{id}/transition or /resolve. A Space may replace this workflow (registry/workflows/ or *_workflow.toon).</text>
</svg>
