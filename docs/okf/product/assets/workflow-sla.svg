<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 400" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>SLA clock and escalation</title><desc>How the SLA sweep moves one Incident or Case through its SLA states (SlaDecisions, ObjectService.sweepIncidentSla).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="400" fill="#FFFFFF"/>
<text x="470" y="24" text-anchor="middle" font-size="13" fill="#444441">SLA overlay on a governed item (sweep every objects.sla.sweep.seconds)</text>
<rect x="20" y="160" width="160" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="100" y="179" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Item created</text>
<text x="100" y="195" text-anchor="middle" font-size="11" fill="#5F5E5A">SlaPolicy by priority</text>
<rect x="240" y="160" width="170" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="325" y="179" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Clock running</text>
<text x="325" y="195" text-anchor="middle" font-size="11" fill="#0F6E56">dueAt, responseDueAt</text>
<rect x="480" y="60" width="190" height="64" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="575" y="79" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Response breached</text>
<text x="575" y="95" text-anchor="middle" font-size="11" fill="#993C1D">slaResponseBreachedAt</text>
<rect x="480" y="260" width="190" height="64" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="575" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Resolution breached</text>
<text x="575" y="295" text-anchor="middle" font-size="11" fill="#993C1D">slaBreachedAt (once)</text>
<rect x="740" y="160" width="180" height="64" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="830" y="179" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Escalated</text>
<text x="830" y="195" text-anchor="middle" font-size="11" fill="#534AB7">reassign / notify /</text>
<text x="830" y="209" text-anchor="middle" font-size="11" fill="#534AB7">raisePriority</text>
<rect x="240" y="300" width="170" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="325" y="319" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Clock stopped</text>
<text x="325" y="335" text-anchor="middle" font-size="11" fill="#5F5E5A">RESOLVED or terminal</text>
<line x1="180" y1="192" x2="240" y2="192" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="214" y="188" text-anchor="start" font-size="10" fill="#5F5E5A">stamp</text>
<line x1="410" y1="175" x2="480" y2="95" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="449" y="131" text-anchor="start" font-size="10" fill="#5F5E5A">still initial</text>
<line x1="410" y1="210" x2="480" y2="285" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="449" y="243.5" text-anchor="start" font-size="10" fill="#5F5E5A">past dueAt</text>
<line x1="670" y1="92" x2="760" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="719" y="122" text-anchor="start" font-size="10" fill="#5F5E5A">on: breach</text>
<line x1="670" y1="292" x2="760" y2="224" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="719" y="254" text-anchor="start" font-size="10" fill="#5F5E5A">on: breach</text>
<line x1="410" y1="192" x2="740" y2="192" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="579" y="188" text-anchor="start" font-size="10" fill="#5F5E5A">on: age (afterMinutes)</text>
<line x1="325" y1="224" x2="325" y2="300" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="329" y="258" text-anchor="start" font-size="10" fill="#5F5E5A">resolve</text>
<text x="20" y="385" text-anchor="start" font-size="10" fill="#5F5E5A">Each breach emits OBJECT_SLA_BREACH; each firing emits OBJECT_ESCALATED and records &lt;rule&gt;@&lt;breach stamp&gt; so a rule fires once per breach (max 500 firings per sweep).</text>
</svg>
