<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 360" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Notification dispatch</title><desc>An event is rendered by a notification rule, deduped and rate-limited, then delivered in-app and through the email and webhook channels of inspecto-notify-channels.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="940" height="360" fill="#FFFFFF"/>
<rect x="20" y="40" width="150" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="95" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Event</text>
<text x="95" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">EventBus (not LOG)</text>
<rect x="200" y="40" width="170" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="285" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">NotificationRule</text>
<text x="285" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">mask, render</text>
<rect x="400" y="40" width="190" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="495" y="59" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Dedupe + rate limit</text>
<text x="495" y="75" text-anchor="middle" font-size="11" fill="#0F6E56">5 identical per hour</text>
<line x1="170" y1="70" x2="200" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="370" y1="70" x2="400" y2="70" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="620" y="20" width="300" height="320" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="628" y="35" font-size="11" fill="#5F5E5A">NotificationService.dispatch</text>
<rect x="640" y="45" width="260" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<text x="770" y="64" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">In-app feed</text>
<text x="770" y="80" text-anchor="middle" font-size="11" fill="#185FA5">store + SSE /notifications/stream</text>
<rect x="640" y="125" width="260" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="770" y="144" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">SPI channels (notify.* flags)</text>
<text x="770" y="160" text-anchor="middle" font-size="11" fill="#0F6E56">gated by preference per category</text>
<rect x="640" y="205" width="260" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="770" y="224" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">ChannelConfig destinations</text>
<text x="770" y="240" text-anchor="middle" font-size="11" fill="#0F6E56">suppression, digest, receipt</text>
<rect x="640" y="280" width="260" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="770" y="299" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">DeliveryReceipt</text>
<text x="770" y="315" text-anchor="middle" font-size="11" fill="#5F5E5A">one per external attempt</text>
<line x1="590" y1="70" x2="640" y2="75" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="590" y1="80" x2="640" y2="155" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<line x1="590" y1="90" x2="640" y2="235" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="150" width="570" height="190" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 3"/>
<text x="28" y="165" font-size="11" fill="#5F5E5A">providers/inspecto-notify-channels (not Basic)</text>
<rect x="40" y="180" width="250" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="165" y="199" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">SmtpEmailChannel  id=email</text>
<text x="165" y="215" text-anchor="middle" font-size="11" fill="#534AB7">javax.mail, STARTTLS required if on</text>
<rect x="320" y="180" width="250" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="445" y="199" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">WebhookChannel  id=webhook</text>
<text x="445" y="215" text-anchor="middle" font-size="11" fill="#993C1D">POST JSON via WebhookEgress</text>
<rect x="320" y="265" width="250" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="445" y="284" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">HttpWebhookSinkTransport</text>
<text x="445" y="300" text-anchor="middle" font-size="11" fill="#993C1D">Pipeline webhook sink, PinnedHttp</text>
<line x1="640" y1="165" x2="570" y2="210" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<line x1="640" y1="245" x2="290" y2="225" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
