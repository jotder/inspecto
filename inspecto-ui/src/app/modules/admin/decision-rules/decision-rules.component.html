<div class="flex min-w-0 flex-auto flex-col">
    <!-- Header -->
    <inspecto-page-header
        title="Decision Rules"
        subtitle="Condition → Consequence rules over Pipeline and Job records — when records match, route/tag/ quarantine/drop them, or run a platform action (emit a signal, raise an alert, start a job). Simulate any rule as a dry run, or Apply to execute its consequences."
    >
        <ng-container actions>
            @if (loading()) {
                <mat-spinner diameter="24"></mat-spinner>
            }
            <button mat-icon-button (click)="load()" [disabled]="loading()" aria-label="Refresh">
                <mat-icon svgIcon="heroicons_outline:arrow-path"></mat-icon>
            </button>
            @if (lens.canAuthorWorkbench()) {
                <button
                    mat-stroked-button
                    (click)="proposeWithAi()"
                    matTooltip="Let the assistant propose a rule you review and save"
                >
                    <mat-icon svgIcon="heroicons_outline:sparkles"></mat-icon>
                    <span class="ml-2">Propose with AI</span>
                </button>
                <button mat-flat-button color="primary" (click)="newRule()">
                    <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
                    <span class="ml-2">New decision rule</span>
                </button>
            }
        </ng-container>
    </inspecto-page-header>

    <!-- Main -->
    <div class="flex flex-auto flex-col p-6 sm:p-10">
        @if (!loading() && rows().length === 0) {
            <inspecto-empty-state
                icon="heroicons_outline:arrows-right-left"
                title="No decision rules yet"
                message="Declare routing rules over your pipelines and jobs — when records match a condition, route them to a branch, tag, quarantine or drop them."
                [actionLabel]="lens.canAuthorWorkbench() ? 'New decision rule' : ''"
                (action)="newRule()"
            ></inspecto-empty-state>
        } @else {
            <inspecto-data-table
                stateKey="decision-rules"
                tier="standard"
                sourceName="decision-rules"
                exportName="decision-rules"
                [rows]="rows()"
                [columns]="columnDefs"
                [rowActions]="rowActions"
                [loading]="loading()"
            />
        }
    </div>
</div>
