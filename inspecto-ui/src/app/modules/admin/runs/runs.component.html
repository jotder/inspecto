<div class="flex h-full min-h-0 min-w-0 flex-auto overflow-hidden">
    <!-- Left: the runs list (survives opening a detail — R5) -->
    <div class="flex h-full min-w-0 flex-auto flex-col overflow-y-auto">
        <!-- Header -->
        <inspecto-page-header
            title="Runs"
            subtitle="Ingest runs and lifecycle actions"
            [terms]="['Run', 'Executable', 'Batch', 'Pipeline']"
        >
            <ng-container actions>
                <mat-slide-toggle [(ngModel)]="autoRefresh">Auto</mat-slide-toggle>
                <button mat-icon-button (click)="load()" matTooltip="Refresh" aria-label="Refresh">
                    <mat-icon svgIcon="heroicons_outline:arrow-path"></mat-icon>
                </button>
                @if (lens.canOperateRuns()) {
                    <button mat-flat-button color="primary" [disabled]="loading()" (click)="runAll()">
                        <mat-icon svgIcon="heroicons_outline:play"></mat-icon>
                        <span class="ml-2">Run all</span>
                    </button>
                }
            </ng-container>
        </inspecto-page-header>

        <!-- Main -->
        <div class="flex flex-auto flex-col p-6 sm:p-10">
            <inspecto-data-table
                tier="standard"
                sourceName="pipelines"
                exportName="pipelines"
                stateKey="runs"
                [rows]="runs()"
                [columns]="columnDefs"
                [rowActions]="rowActions"
                [loading]="loading()"
                [autoHeight]="true"
                noRowsTitle="No ingest runs configured"
                noRowsHint="Runs are defined by *_pipeline.toon configs on the server."
            />
        </div>
    </div>

    <!-- Right: run detail as a resizable side panel (R5, the object-mail pattern) -->
    @if (detailName(); as name) {
        <div
            inspectoSplit="runs.detail"
            #detailSplit="inspectoSplit"
            pane="right"
            [min]="380"
            [max]="900"
            [defaultWidth]="560"
            aria-label="Resize detail panel (arrow keys or drag)"
            class="h-full"
        ></div>
        <app-run-detail
            class="block h-full shrink-0 overflow-y-auto border-l"
            style="border-color: var(--gamma-border)"
            [style.width.px]="detailSplit.width()"
            [name]="name"
            [embedded]="true"
            (closed)="closeDetail()"
        />
    }
</div>
