<!-- One shell for both modes. View is the identical editor with every mutating affordance withheld
     (`readOnly`), not a separate read-only page — so switching lens never relearns the layout.

     The admin shell scrolls at document level — nothing above us is viewport-bounded, so `flex-1`
     alone would let the docks grow the page instead of the canvas yielding space. Bound the shell to
     the viewport minus the classic layout's chrome (64px header + 56px footer); the canvas then
     shrinks for the bottom dock instead of pushing the page taller. -->
<div class="flex min-h-0 min-w-0 flex-auto flex-col overflow-hidden" style="height: calc(100dvh - 120px)">
    <app-pipeline-editor [readOnly]="mode() === 'combined'">
        <span toolbarEnd class="flex shrink-0 items-center gap-2">
            <inspecto-ai-explain screen="Pipelines" [terms]="['Pipeline', 'Step', 'Trigger']" />
            <mat-button-toggle-group
                [value]="mode()"
                (change)="setMode($event.value)"
                aria-label="Pipelines view mode"
                hideSingleSelectionIndicator
            >
                <mat-button-toggle value="combined">View</mat-button-toggle>
                <mat-button-toggle value="editor">Edit</mat-button-toggle>
            </mat-button-toggle-group>
        </span>
    </app-pipeline-editor>
</div>
