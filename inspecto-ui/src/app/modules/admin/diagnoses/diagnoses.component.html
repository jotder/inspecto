<div class="flex min-w-0 flex-auto flex-col">
    <!-- Header -->
    <inspecto-page-header title="Diagnoses" subtitle="Recent failure root-cause analyses (assist agent)">
        <ng-container actions>
            <mat-form-field class="gamma-mat-dense w-28" subscriptSizing="dynamic">
                <mat-label>Limit</mat-label>
                <input matInput type="number" min="1" max="500" [(ngModel)]="limit" />
            </mat-form-field>
            <button mat-icon-button (click)="load()" matTooltip="Refresh" aria-label="Refresh">
                <mat-icon svgIcon="heroicons_outline:arrow-path"></mat-icon>
            </button>
        </ng-container>
    </inspecto-page-header>

    <!-- Main -->
    <div class="flex flex-auto flex-col p-6 sm:p-10">
        <inspecto-data-table
            stateKey="diagnoses"
            tier="standard"
            sourceName="diagnoses"
            exportName="diagnoses"
            [rows]="diagnoses()"
            [columns]="columnDefs"
            [loading]="loading()"
            noRowsTitle="No diagnoses yet"
            noRowsHint="None recorded, or the assist agent is not running."
            (rowClick)="openDetail($any($event))"
        />
    </div>
</div>
