<!-- Personal / offline is an auth-free shell: no principal to name and no session to end, so the whole
     menu is suppressed rather than left showing a blank "Signed in as" over a Sign out that cannot work. -->
@if (signedInEdition() === 'oidc') {
    <!-- Button -->
    <button mat-icon-button [matMenuTriggerFor]="userActions" aria-label="User menu">
        <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
    </button>

    <mat-menu [xPosition]="'before'" #userActions="matMenu">
        <button mat-menu-item>
            <span class="flex flex-col leading-none">
                <span>Signed in as</span>
                <span class="mt-1.5 text-md font-medium">{{ user_name }}</span>
            </span>
        </button>
        <mat-divider class="my-2"></mat-divider>
        <button mat-menu-item (click)="signOut()">
            <mat-icon
                [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"
            ></mat-icon>
            <span>Sign out</span>
        </button>
    </mat-menu>
}
