name: Release
# Release pipeline (compliance matrix G3 / COMPLY-2): a tagged release is built, SBOM'd, checksummed and
# SIGNED here — and only here. The operator decision of 2026-08-30 put the release key in the CI secret
# store, held by no shift locally, so signing is a mandatory step of THIS pipeline rather than an optional
# `package.ps1 -Sign` flag someone remembers to pass. Two accepted consequences, stated rather than
# discovered: a release cut OUTSIDE CI cannot be signed at all, and custody of the key (who can read the
# secret, rotation, CI-provider compromise) is a CC6 access-control item —
# compliance/evidence/release-verification.md §4.
#
# Secrets (repository → Settings → Secrets → Actions):
#   INSPECTO_SIGNING_KEY_ASC  — the ASCII-armoured PRIVATE key (gpg --armor --export-secret-keys <id>)
#   INSPECTO_SIGNING_KEY_ID   — the key id / fingerprint package.ps1 passes to gpg --local-user
#   INSPECTO_SIGNING_KEY_PASSPHRASE — optional; empty for a passphrase-less CI key
#
# RELEASE-PIPELINE-NEVER-EXECUTED-1: `push: tags` is the only trigger that PUBLISHES, and no tag has been
# cut since v3.9.0 (2026-06-01) — so the packaging chain below went two months without a real end-to-end
# run, and the breakage that accumulated was invisible until someone cut a tag. `workflow_dispatch` exists
# to make that chain runnable WITHOUT publishing anything: it builds, packages and SBOMs all three
# editions, and stops. ⛔ Every step that signs, or that publishes, is gated on `github.event_name ==
# 'push'` — a dispatch run holds no signing key and creates no GitHub release, so it cannot be mistaken
# for, or promoted to, a real release. ⚠ It therefore does NOT exercise signing or publication; it proves
# the reactor-install → extension-cache → package → SBOM → smoke chain only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # gh release create / upload

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '27'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # inspecto-agent depends on the pre-release eoiagent (same arrangement as ci.yml)
      #
      # ⛔ PINNED, and ci.yml deliberately is NOT (operator call, 2026-09-16). A RELEASE built from a
      # floating branch is not reproducible: re-running this workflow for the same tag could pick up a
      # different upstream commit and emit different bytes under the same version. That is a supply-chain
      # property an auditor tests, not a style preference — see compliance/evidence/release-verification.md
      # (SOC 2 CC8, NIST SI-2/SR). CI stays unpinned ON PURPOSE so it remains the canary that catches
      # upstream drift early; pinning both would just defer the breakage to release day.
      # ⚠ Bumping this SHA is a deliberate act: check that upstream's pom still declares the version in
      # this repo's <eoiagent.version> (0.2.0-SNAPSHOT) before moving it. The upstream v0.1.0 TAG is not a
      # substitute — it predates that version and was not verified to satisfy the dependency.
      - name: Checkout eoiagent (jotder/inspect-agent, pre-release — no packages yet)
        uses: actions/checkout@v4
        with:
          repository: jotder/inspect-agent
          ref: a24817ba6151245c3f0ddacf9886954ef68f260d  # main @ 2026-09-14; pom declares 0.2.0-SNAPSHOT
          path: eoiagent-src
      - name: Build & install eoiagent into local .m2
        run: mvn --batch-mode --no-transfer-progress -DskipTests install
        working-directory: eoiagent-src

      # SBOM-RESOLVE-1 (2026-09-09): install THIS reactor too, or packaging cannot generate its bill of
      # materials and the tag fails. `package.ps1` runs `mvn ... package` and then invokes tools/sbom.mjs as
      # a SEPARATE process; that fresh session shells `mvn dependency:list`, which resolves sibling reactor
      # modules only from `~/.m2` — never from a jar built in an earlier invocation. The step above installs
      # the AGENT dependency, never this reactor. A non-zero exit from the generator throws by design
      # (`a bundle ships with its SBOM or not at all`), so the release stops.
      #
      # ci.yml:130-135 already records this exact reasoning for the dependency guard, which shells the same
      # command; release.yml never got the same treatment.
      #
      # `-Pedition-enterprise` and NOT the default reactor: the nine edition modules are profile-scoped, so
      # a plain install leaves `inspecto-ops` and `inspecto-policy` absent — and Enterprise is the flavour
      # that fails first, because `inspecto-policy` gained a TEST-scoped edge to `inspecto-ops` in EDG-01
      # cell 7 and resolution covers every scope regardless of the generator's `-DincludeScope=runtime`.
      # Enterprise is the superset (9 modules vs Standard's 8), so one pass covers every edition packaged
      # below. ⛔ Do NOT "fix" this by narrowing the scope filter: the failure is in RESOLUTION, which
      # precedes filtering.
      - name: Install the reactor into .m2 so the SBOM generator can resolve it (SBOM-RESOLVE-1)
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Pedition-enterprise install

      - name: Install UI dependencies
        run: npm ci
        working-directory: inspecto-ui

      # The key never touches the checkout: imported into the runner's ephemeral keyring, used, gone
      # with the runner. Fail-closed: an empty/missing secret stops the release before anything builds.
      - name: Import the release signing key
        if: github.event_name == 'push'
        env:
          KEY_ASC: ${{ secrets.INSPECTO_SIGNING_KEY_ASC }}
          KEY_ID: ${{ secrets.INSPECTO_SIGNING_KEY_ID }}
          KEY_PASSPHRASE: ${{ secrets.INSPECTO_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ASC" ] || [ -z "$KEY_ID" ]; then
            echo "::error::INSPECTO_SIGNING_KEY_ASC / INSPECTO_SIGNING_KEY_ID are not set — a release cannot be signed, so it is not cut."
            exit 1
          fi
          printf '%s' "$KEY_ASC" | gpg --batch --import
          # a passphrase-protected key needs the agent primed for non-interactive signing
          if [ -n "$KEY_PASSPHRASE" ]; then
            echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
            gpg-connect-agent reloadagent /bye
            for keygrip in $(gpg --batch --with-keygrip --list-secret-keys "$KEY_ID" | awk '/Keygrip/ {print $3}'); do
              /usr/lib/gnupg/gpg-preset-passphrase --preset --passphrase "$KEY_PASSPHRASE" "$keygrip"
            done
          fi
          gpg --batch --list-secret-keys "$KEY_ID" > /dev/null

      # Populate the DuckDB extension cache for BOTH platforms before any packaging step
      # (AIRGAP-EXTENSIONS-CI-1, 2026-09-14).
      # 🔴 Measured: nothing here ever populated one, and package.ps1 stages extensions best-effort from a
      # cache and only WARNS when it finds none — so every released bundle, on every platform, shipped an
      # empty duckdb-extensions/. AIRGAP-EXTENSIONS-1 (closed 2026-09-11, to stop `ducklake` needing a
      # network INSTALL on an air-gapped install) was therefore never delivered by a release: the code half
      # was real and the packaging half silently no-opped in the only place that builds one.
      # ⛔ `INSTALL <name>` would NOT work here: it populates the cache for the RUNNING platform only, and
      # this is ubuntu-latest while the bundle also ships windows_amd64. The script downloads per platform.
      # ⚠ It reads the extension list out of package.ps1 itself, so adding a name there is enough.
      - name: Populate the DuckDB extension cache (both platforms)
        run: node tools/fetch-duckdb-extensions.mjs --out "$RUNNER_TEMP/duckdb-extensions"

      # Every edition, signed, each WITH an embedded trimmed runtime (OPS-07, 2026-09-14).
      # These steps used to pass -NoRuntime "because the jlink runtime needs the GraalVM jmods cache this
      # runner does not carry", so no published bundle ever contained a runtime. That cause was wrong: the
      # blocker was package.ps1 hardcoding `jlink.exe`, which cannot exist on this ubuntu runner. Measured
      # in eclipse-temurin:25-jdk (what setup-java installs here): jlink is at $JAVA_HOME/bin/jlink, the
      # image ships ZERO jmods, and jlink still links a working ~64 MB runtime from the run-time image
      # itself (JEP 493). Both launchers are conditional, so a Linux-built runtime serves Linux targets
      # while Windows targets keep falling back to system java.
      # ⛔ If a release ever fails at "Embedding trimmed Java runtime", re-add -NoRuntime to unblock the
      # cut and reopen OPS-07 — do NOT provision a jmods cache, which is not what was missing.
      - name: Package + SBOM + sign — Personal
        env:
          INSPECTO_SIGNING_KEY: ${{ secrets.INSPECTO_SIGNING_KEY_ID }}
        run: pwsh -NoProfile -File inspecto/package.ps1 -Edition Personal ${{ github.event_name == 'push' && '-Sign' || '' }} -RequireExtensions -DuckdbExtensionCache "$RUNNER_TEMP/duckdb-extensions"
      # Examples smoke (EXAMPLES-STEPS-1): run one bundled example through the bundle's OWN runner against the
      # packaged jar, so a runner that stops declaring -Dassist.safety.roots ("no allowed roots configured")
      # fails the release instead of shipping. hello-csv is the minimum pipeline: CSV -> Parquet, 4 typed columns.
      - name: Smoke - the bundled examples run against the packaged jar
        run: |
          set -euo pipefail
          bash inspecto-deploy/examples/run-example.sh 01-ingest/hello-csv --clean
          n=$(find inspecto-deploy/examples/01-ingest/hello-csv/out/database -type f -name '*.parquet' | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::hello-csv ran but produced no parquet under out/database"; exit 1; }
          rm -rf inspecto-deploy/examples/01-ingest/hello-csv/out
      # EXAMPLES-JOBS-SMOKE-1 (2026-09-17). 🔴 The smoke above carries NO job config, and until this step
      # NOTHING automated — here or in ci.yml — ever ran one. That is how 06-serve/maintenance-library
      # shipped broken for part of 2026-09-16: `compact_job.toon` still said `dir: out/database` after
      # ea862d1b moved PartitionCompactor onto PathJail.requireJobPathUnderAny, so the path no longer
      # denoted the directory it names.
      #
      # ⛔ Listing jobs does NOT detect this, which is why the step triggers them. Measured: with the
      # broken value, GET /jobs is byte-identical to a healthy run — all five registered, enabled,
      # lastStatus "". The mis-pointed path surfaces only when the task RESOLVES it, i.e. in a RUN, and
      # every job here is on a weekly/daily cron so a plain --demo never fires one.
      #
      # ⚠ Personal ONLY, and deliberately placed under the Personal bundle: POST /jobs/{n}/trigger is
      # behind canOperateRuns, a no-op on Personal (no Subject is ever attached) but a real capability
      # on Professional/Enterprise — the same step after those packages would 401/403 for a reason that has
      # nothing to do with the examples.
      #
      # ⚠ Proven RED and GREEN from the command line on Windows (re-point `dir` to `out/database` ->
      # compact_sales FAILED, exit 1; restore -> five SUCCESS, exit 0). It has NOT been executed on
      # ubuntu-latest; the runner is plain POSIX (curl + background java + kill), but if this step is
      # the one that goes red on the first tag, read out/logs/serve.err.log in the job output before
      # assuming the examples regressed.
      - name: Smoke - a job-bearing example runs its jobs against the packaged jar
        run: bash inspecto-deploy/examples/serve-example.sh 06-serve/maintenance-library --check-jobs --clean
      # RELEASE-BUNDLE-PLATFORM-MISMATCH-1 / RELEASE-LINUX-ZIP-NEVER-PUBLISHED-1 (2026-09-17): package.ps1 now
      # emits one `inspecto-deploy-<platform>.zip` per target platform, named for the runtime it embeds.
      # These steps used to name only the `inspecto-deploy.zip*` trio — a HOST (Linux) image zipped with the
      # windows_amd64 extension set — so no Linux-labelled artifact was ever published and the one that was
      # could load none of its extensions. tools/release-collect.sh collects EVERY produced platform zip
      # (+ .sha256 + .asc) and FAILS if the runner's own platform (linux_amd64 on ubuntu-latest) is missing.
      - name: Collect Personal artifacts
        run: |
          set -euo pipefail
          bash tools/release-collect.sh personal
          cp inspecto-deploy/sbom/inspecto-personal.cdx.json inspecto-deploy/sbom/inspecto-personal.spdx.json release/
      # PROFESSIONAL-BUNDLE-1 (2026-09-10): Professional is its OWN artifact. Until now the pipeline shipped Personal
      # and Enterprise only, labelling Enterprise "superset of Professional" — true of the module set, false of
      # runtime identity: the launchers infer the edition from jar presence, so an Enterprise bundle handed
      # to a Professional customer self-identified as Enterprise and enabled ABAC they had not bought. A Professional
      # customer must receive a bundle that never carried inspecto-policy.jar. package.ps1 -Edition Professional
      # has built exactly that set (-Pedition-professional, no policy jar) since W6; only the release step was missing.
      - name: Package + SBOM + sign — Professional
        env:
          INSPECTO_SIGNING_KEY: ${{ secrets.INSPECTO_SIGNING_KEY_ID }}
        run: pwsh -NoProfile -File inspecto/package.ps1 -Edition Professional ${{ github.event_name == 'push' && '-Sign' || '' }} -RequireExtensions -DuckdbExtensionCache "$RUNNER_TEMP/duckdb-extensions"
      - name: Collect Professional artifacts
        run: |
          set -euo pipefail
          bash tools/release-collect.sh professional
          cp inspecto-deploy/sbom/inspecto-professional.cdx.json inspecto-deploy/sbom/inspecto-professional.spdx.json release/
          # the commercial property this step exists for: no policy jar in what a Professional customer receives
          # (checked on the collected copies — release-collect.sh removes the originals so one edition's zips
          # can never be mistaken for the next's)
          for z in release/inspecto-deploy-professional-*.zip; do
            if unzip -l "$z" | grep -q 'inspecto-policy'; then
              echo "::error::the Professional bundle $z carries inspecto-policy — it would self-identify as Enterprise"; exit 1
            fi
          done
      - name: Package + SBOM + sign — Enterprise
        env:
          INSPECTO_SIGNING_KEY: ${{ secrets.INSPECTO_SIGNING_KEY_ID }}
        run: pwsh -NoProfile -File inspecto/package.ps1 -Edition Enterprise ${{ github.event_name == 'push' && '-Sign' || '' }} -RequireExtensions -DuckdbExtensionCache "$RUNNER_TEMP/duckdb-extensions"
      - name: Collect Enterprise artifacts
        run: |
          set -euo pipefail
          bash tools/release-collect.sh enterprise
          cp inspecto-deploy/sbom/inspecto-enterprise.cdx.json inspecto-deploy/sbom/inspecto-enterprise.spdx.json release/

      # Verify what we are about to publish with the PUBLIC half only — the same check a customer runs.
      # ⚠ Push-only because a dispatch run is deliberately unsigned: the .asc files this checks do not
      # exist there. The checksum half WOULD be meaningful on a dispatch run — splitting the two is
      # tracked, not forgotten (RELEASE-PIPELINE-NEVER-EXECUTED-1 residual).
      - name: Verify checksums and signatures
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          cd release
          for zip in *.zip; do
            (sha256sum -c "$zip.sha256" | grep -q ': OK') || { echo "::error::checksum mismatch for $zip"; exit 1; }
            gpg --batch --verify "$zip.asc" "$zip"
            # The bundle's name, embedded JVM and DuckDB extension set must all agree — the mismatch that
            # RELEASE-BUNDLE-PLATFORM-MISMATCH-1 shipped (Linux JVM + windows_amd64 extensions) was visible
            # only in the zip's own entry table, never to the boot smoke, so it is asserted from the table.
            plat=$(basename "$zip" .zip | sed -E 's/^inspecto-deploy-(personal|professional|enterprise)-//')
            entries=$(unzip -Z1 "$zip")
            case "$plat" in
              linux_amd64)   grep -qx 'inspecto-deploy/runtime/bin/java'     <<<"$entries" || { echo "::error::$zip: no runtime/bin/java";     exit 1; } ;;
              windows_amd64) grep -qx 'inspecto-deploy/runtime/bin/java.exe' <<<"$entries" || { echo "::error::$zip: no runtime/bin/java.exe"; exit 1; } ;;
              *) echo "::error::$zip: unknown platform suffix '$plat'"; exit 1 ;;
            esac
            grep -q "^inspecto-deploy/duckdb-extensions/$plat/" <<<"$entries" || { echo "::error::$zip: no duckdb-extensions/$plat/"; exit 1; }
            if grep '^inspecto-deploy/duckdb-extensions/' <<<"$entries" | grep -qv "^inspecto-deploy/duckdb-extensions/$plat/"; then
              echo "::error::$zip carries another platform's DuckDB extensions"; exit 1
            fi
            # RELEASE-LAUNCHERS-NOT-EXECUTABLE-1: a Linux zip built on this POSIX runner goes through Info-ZIP,
            # which records POSIX modes; a customer's unzip must yield an executable serve.sh.
            if [ "$plat" = linux_amd64 ]; then
              unzip -Z "$zip" inspecto-deploy/serve.sh | grep -q '^-rwx' || { echo "::error::$zip: serve.sh is not executable in the archive"; exit 1; }
            fi
          done
          ls -la

      - name: Publish the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release/*
