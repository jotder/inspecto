name: UI

# Builds the Inspector operator console (inspecto-ui/, the gamma-template Angular SPA:
# ag-Grid / Chart.js / AntV G6). Kept fully separate from the Java ci.yml: the Node toolchain
# never enters the Maven reactor. Path-filtered to inspecto-ui/** so backend-only changes
# don't trigger a frontend build (and vice-versa).

on:
  push:
    branches: [master, main, 3.x]
    paths: ['inspecto-ui/**', '.github/workflows/ui.yml']
  pull_request:
    branches: [master, main, 3.x]
    paths: ['inspecto-ui/**', '.github/workflows/ui.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: inspecto-ui

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: inspecto-ui/package-lock.json

      # npm ci fails if package-lock.json is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      # Design-system governance guard: no hardcoded colors / status-color helpers in
      # inspecto-authored source (use --gamma-* vars, Tailwind, <inspecto-status-badge>,
      # chart-tokens.ts). Pure Node, fast — fails early before the heavier steps.
      - name: Design-system guard
        run: npm run lint:tokens

      # Formatting guard. .prettierrc.json has been pinned since 2026-08-13, but nothing ran
      # `prettier --check`, so 68 files under src/ had drifted out of it unnoticed by 2026-08-31.
      # ⚠ Deliberately --check and never --write in CI: a reflow can change what a template
      # RENDERS (Angular collapses an inserted newline into a space) and can strand a `ds-allow`
      # comment from the line the design-system guard matches it against, so a human runs
      # `npm run format` and reads the diff. .prettierignore already exempts the vendored
      # gamma/Fuse tree and the Jackson-written *.contract.json the Java tests byte-compare.
      - name: Formatting guard
        run: npm run format:check

      # Unit tests (Vitest via @angular/build:unit-test, jsdom); single run, no watch.
      # The guarded e2e backend smoke (src/e2e) self-skips without E2E_BASE_URL.
      # GUARD-SWEEP-1e (2026-09-07). `npm run build` type-checks ONLY tsconfig.app.json, and the unit-test
      # target only tsconfig.spec.json — the ROOT tsconfig.json was checked by nothing. The angular-ui skill
      # has required all three for months ("`npm run build` covers only the app one"); nothing enforced it.
      # ⚠ The root config is a genuinely DIFFERENT gate, not a superset: it sets no `types`, so a spec using
      # a vitest-only matcher type-errors there while passing test:ci and both other configs.
      - name: Typecheck (all three tsconfigs)
        run: npm run typecheck

      # `test:coverage`, not `test:ci` (GUARD-SWEEP-1g, 2026-09-08): the UI had NO coverage
      # configuration at all, so the repo had no UI number. Coverage is REPORTING only — no
      # `coverageThresholds` is set, so this cannot fail the job. ⛔ Choosing a threshold is a policy
      # decision; this step exists to produce the data it needs. Measured baseline 2026-09-08:
      # statements 73.82%, branches 70.04%, functions 62.41%, lines 77.77%.
      # ⚠ Scope mirrors what the design-token guard and prettier already treat as OURS — src/app/inspecto
      # and src/app/modules/admin — with the vendored @gamma/** and modules/auth/** excluded. Measuring
      # vendored template code would make the percentage meaningless.
      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: inspecto-ui/coverage/
          if-no-files-found: warn
          retention-days: 14

      # The same repo-wide guard, run from the repo root so it finds inspecto-ui/coverage/. ⚠ It reports
      # the backend as skipped here (no jacoco.csv in this job — the UI workflow never builds Java), and
      # says so rather than presenting half the picture as all of it.
      - name: Coverage floors (UI)
        working-directory: .
        run: node tools/check-coverage.mjs --ui

      # Production build is the green gate (AOT type-check + bundle + budgets).
      # No dev-only fileReplacements, so one configuration covers both.
      - name: Build (production)
        run: npm run build
