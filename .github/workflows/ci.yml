name: CI

# Runs the test suite on every push and pull request so regressions land at
# review time instead of in production. The build is a two-module Maven reactor
# (core engine + optional assist agent); the full suite finishes in ~30 seconds.

on:
  push:
    branches: [master, main, 3.x]
    tags: ['v*']
  pull_request:
    branches: [master, main, 3.x]

# Default GITHUB_TOKEN perms, narrowed to just reading this repo — eoiagent is built from source
# below, so no GitHub Packages auth is needed here.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # DAT-6-CI-1 (2026-09-07). The embedded-Postgres harness was removed by operator decision — Postgres is
    # installed separately or pointed at — which left `PostgresStateStoreTest` reporting 11 SKIPPED and the
    # only proof that the JDBC stores run on real Postgres (chiefly `percentile_cont`, the one piece of
    # non-portable SQL) executing NOWHERE. A service container IS "an existing server", so this restores the
    # coverage without reversing the decision: no embedded engine, no per-platform binaries, just a URL.
    # ⚠ The test creates and drops its own schema per run, so a shared container is safe.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Canonical-vocabulary guard, two passes (docs/GLOSSARY.md). (1) User-facing docs must not use ⛔
      # banned synonyms (Flow, Data Store, Collector-as-noun) or the Measure/Metric confusion. (2) The
      # committed TOON config corpus must not grow a banned KEY — cheapest surface to police, since a bad
      # key costs nothing here but costs a migration once operators have authored data against it. Pure
      # Node (preinstalled on the runner), fast — fails early before the heavier steps.
      - name: Guard — canonical vocabulary in user-facing docs + TOON config keys
        run: node tools/check-vocabulary.mjs

      # Committed-secret guard (SEC-INCIDENT-1, docs/BACKLOG.md §5): a secret-ish key assigned a long
      # literal fails the build. Five OAuth client secrets reached a public remote this way; history
      # keeps leaked values forever, so blocking REINTRODUCTION is the only durable control. Pure Node,
      # ~1s. (It also ran on `4.x` from 2026-07-25 until that branch was deleted 2026-08-17.)
      - name: Guard — no committed secrets
        run: node tools/check-secrets.mjs

      # Step Processors board guard (CONNECTORS-BUNDLE-1 follow-up, 2026-09-07). docs/EDITIONS.md's
      # `| SP-*` rows are GENERATED from inspecto-ui/src/app/inspecto/contracts/processor-catalog.contract.json
      # (itself written by ProcessorCatalogContractTest), plus the per-edition decisions the renderer holds
      # in code. The script has advertised a `--check` mode as CI-friendly since it was written, and nothing
      # ran it — so the board could drift from the catalog silently, which is the one thing generating it was
      # meant to prevent. It had in fact drifted by the time this step was added. Pure Node, ~instant; the
      # fix when it fails is `node tools/render-processor-board.mjs`, never a hand-edited `| SP-` row.
      - name: Guard — Step Processors board is generated, not hand-edited
        run: node tools/render-processor-board.mjs --check

      # Gate-tally guard (2026-09-07). BACKLOG §2 states its own arithmetic — "N of the M gates were RUN"
      # — and this refuses a build where that sentence disagrees with the table under it. It exists
      # because the sentence was wrong the day the section was rewritten to be checkable: it claimed
      # "13 of 15" over a 16-row table, having silently counted 4 rows nobody could check as gates that
      # hold. A number that looks like evidence and is not is invisible to every other guard here.
      # Pure Node, ~instant. Falsified in both directions (wrong total, wrong not-run count, a dropped
      # marker, a deleted sentence, and an unmatched table) before it was wired in.
      - name: Guard — BACKLOG §2's gate tally matches its table
        run: node tools/check-gate-tally.mjs

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The optional inspecto-agent module now depends on eoiagent (com.eoiagent:*:0.2.0-SNAPSHOT —
      # the version the parent POM pins; this comment said 0.1.0-SNAPSHOT until 2026-08-28),
      # which replaced the discontinued agent-kernel. eoiagent is pre-release and not yet published to
      # GitHub Packages, so CI checks out its source (public repo jotder/inspect-agent) and installs it
      # into the runner's local ~/.m2 — the same thing a local dev does by hand. Once eoiagent cuts a
      # 0.1.0 release and starts publishing to GitHub Packages, swap this for a settings.xml repo/auth
      # step like the old agent-kernel one (see git history) and drop this checkout+build.
      - name: Checkout eoiagent (jotder/inspect-agent, pre-release — no packages yet)
        uses: actions/checkout@v4
        with:
          repository: jotder/inspect-agent
          path: eoiagent-src

      - name: Build & install eoiagent into local .m2
        run: mvn --batch-mode --no-transfer-progress -DskipTests install
        working-directory: eoiagent-src

      # Build the whole reactor from the root POM so the optional agent module and
      # the cross-module AssistAgent SPI wiring are exercised, not just the core.
      # eoiagent resolves from the local .m2 build above.
      #
      # `install`, not `test` (2026-09-07): the dependency guard below shells its own
      # `mvn dependency:list`, a fresh session that resolves reactor SNAPSHOTs from `~/.m2` — and on a
      # clean runner nothing has been installed there, so it died with "Could not find artifact
      # com.gamma.asn:asn-core:0.1.0-SNAPSHOT" the first time it ever got to run. It had looked healthy
      # locally only because a developer's `~/.m2` is warm from past builds: a guard passing on
      # environment state rather than on the thing it checks. Installing here costs one shade pass and
      # makes the guard actually executable. See okf/backend/build-run/guard-coverage.md.
      #
      # `-Pedition-enterprise` (GUARD-SWEEP-1a, 2026-09-07): the profile is MODULES-ONLY — it adds
      # inspecto-security and inspecto-policy, which are absent from the default <modules> and were
      # therefore never built or tested by ANY workflow. That left 54 test methods running nowhere
      # automated: all OIDC authentication, token relay, ABAC policy enforcement and keystore-secret
      # resolution — the security-critical surface. `release.yml` does build Enterprise, but with
      # -DskipTests, so a compile break was caught at tag time and a test regression never was.
      # Enterprise is the superset, so this one flag covers Standard too, in the same reactor pass.
      #
      # `-Pcoverage` (GUARD-SWEEP-1g, 2026-09-08): jacoco had been configured for months behind this
      # profile and NO workflow activated it, so the repo had no coverage number at all — the "no coverage
      # gate anywhere" gap. It is REPORTING only: the profile binds prepare-agent + report and no `check`
      # goal, so this cannot fail a build. ⛔ A threshold is deliberately NOT set here — choosing what
      # number blocks whom is a policy decision, and the point of this step is to produce the data that
      # decision needs. Measured baseline 2026-09-08: instructions 81.01%, branches 67.19%, lines 80.88%
      # across 26 reporting modules (239572/295731 instructions).
      # ⚠ That is the HONEST figure. The first measurement said 82.92% across 21 modules, because the
      # asn-parser tree was never instrumented — a separate root POM, and a Maven profile is inherited
      # through <parent>, never through aggregation. Adding the profile there pulled the number DOWN by
      # ~1.9 points, mostly from asn-golden (4.4%) and asn-plugin-vendors (12.2%), whose tests are
      # environment-gated. ⚠ A module with ZERO tests writes no jacoco.exec and so vanishes from the
      # denominator rather than dragging it down — immaterial here (~800 lines across 4 modules) but the
      # reason the percentage is not a measure of "code with tests". See
      # okf/backend/build-run/guard-coverage.md.
      - name: Run tests (all editions) with coverage, and install so the dependency guard can resolve the reactor
        run: >-
          mvn --batch-mode --no-transfer-progress install -Pedition-enterprise -Pcoverage
          '-Dinspecto.test.pg.url=jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postgres'

      # Keep the reports so a trend is visible run-to-run — without this the number exists only in the
      # log and nobody can say whether it moved.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/'
          if-no-files-found: warn
          retention-days: 14

      # Repo-WIDE floors (operator decision 2026-09-08), summed across the per-module CSVs.
      # ⚠ Not `jacoco:check`: that goal binds per module, so it would gate every module on its own
      # number — inspecto-util (49.6%) and asn-golden (4.4%) would fail while the codebase as a whole
      # sits well above the floor. Summing is the only way to enforce ONE number.
      # ⚠ Absent reports FAIL rather than pass, so a build that lost `-Pcoverage` cannot slip through.
      - name: Coverage floors
        run: node tools/check-coverage.mjs --backend

      # Boundary law (U1): the lean ETL core never gains a kernel dependency. Kernel types live
      # ONLY in the optional inspecto-agent module, behind the AssistAgent SPI. This guard
      # makes that enforceable, not aspirational — it fails the build if a com.gamma.agentkernel
      # reference ever leaks into the lean core's sources or its resolved dependency tree.
      - name: Guard — lean core stays kernel-free
        run: |
          if grep -rEl "com\.gamma\.agentkernel" inspecto/src; then
            echo "::error::lean core (inspecto) must not reference com.gamma.agentkernel"; exit 1
          fi
          if mvn --batch-mode --no-transfer-progress -pl inspecto dependency:tree | grep -E "com\.gamma\.agentkernel"; then
            echo "::error::lean core (inspecto) must not depend on agent-kernel"; exit 1
          fi
          echo "OK: inspecto is kernel-free (sources + dependency tree)"

      # Dependency-review guard (compliance C4 / matrix gap G7). Diffs the RESOLVED runtime
      # dependency graph against the committed tools/dependencies.lock, so a dependency cannot
      # appear, vanish or change version without the lock moving in the same commit — which is what
      # makes it reviewable. The POMs pin what we ASK for; the lock pins what we actually GET, and a
      # sibling SNAPSHOT can move a transitive without any POM here changing a line.
      # ⛔ NOT a vulnerability scanner (offline by constraint — see the script header); do not cite
      # it to an auditor as vulnerability management. Runs AFTER the eoiagent install, because the
      # graph it resolves includes com.eoiagent:*.
      - name: Guard — dependency review (lockfile diff)
        run: node tools/check-dependencies.mjs

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

# Note: CI does not build or store the fat JAR. It is ~90 MB (almost entirely
# DuckDB's per-platform native binaries) and would bloat Actions artifact
# storage on every tag for no benefit — the downloadable release JAR is built
# locally and attached to the GitHub release at cut time (see the release flow),
# not produced here.
