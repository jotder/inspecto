name: CI

# Runs the test suite on every push and pull request so regressions land at
# review time instead of in production. The build is a two-module Maven reactor
# (core engine + optional assist agent); the full suite finishes in ~30 seconds.

on:
  push:
    branches: [master, main, 3.x]
    tags: ['v*']
  pull_request:
    branches: [master, main, 3.x]

# Default GITHUB_TOKEN perms, narrowed to just reading this repo — eoiagent is built from source
# below, so no GitHub Packages auth is needed here.
permissions:
  contents: read

jobs:
  # ── Repo guards: their OWN job (2026-09-17) ──────────────────────────────────────────────────────
  # These fifteen pure-Node checks used to be the first steps of `test`, cheapest-first, ahead of the
  # reactor. A job stops at its first failing step, so a stale generated table — a P3 at most — silenced
  # the ENTIRE test suite for a day on 2026-09-16 (three stacked failures surfaced one per run; see
  # okf/backend/build-run/guard-coverage.md "three unrelated defects behind ONE red gate"). Running them
  # as a sibling job keeps every guard AND the tests reporting on the same push: a red guard no longer
  # buys silence for the expensive signal behind it. Nothing here needs the JDK, Postgres or the
  # eoiagent checkout, which is why it can run without them.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      # Canonical-vocabulary guard, two passes (docs/GLOSSARY.md). (1) User-facing docs must not use ⛔
      # banned synonyms (Flow, Data Store, Collector-as-noun) or the Measure/Metric confusion. (2) The
      # committed TOON config corpus must not grow a banned KEY — cheapest surface to police, since a bad
      # key costs nothing here but costs a migration once operators have authored data against it. Pure
      # Node (preinstalled on the runner), fast — fails early before the heavier steps.
      - name: Guard — canonical vocabulary in user-facing docs + TOON config keys
        run: node tools/check-vocabulary.mjs

      # Committed-secret guard (SEC-INCIDENT-1, docs/BACKLOG.md §5): a secret-ish key assigned a long
      # literal fails the build. Five OAuth client secrets reached a public remote this way; history
      # keeps leaked values forever, so blocking REINTRODUCTION is the only durable control. Pure Node,
      # ~1s. (It also ran on `4.x` from 2026-07-25 until that branch was deleted 2026-08-17.)
      - name: Guard — no committed secrets
        run: node tools/check-secrets.mjs

      # Path-jail root guard (SAFETY-ROOTS-UNDECLARED-1, 2026-09-16). The one-shot ETL CLI and
      # single-tenant serve host no space, so `SpaceManager` pushes nothing into `DiscoveredRoots` and
      # `-Dassist.safety.roots` is their ONLY source of allowed roots — drop it and `defaultPolicy()`
      # returns an EMPTY list, killing every jailed value with "no allowed roots configured". All six
      # launchers declare it today; nothing enforced that, and each also NAMES the flag in its own
      # comments, so a grep-shaped check would stay green after the real declaration was deleted. This
      # strips comments first and asserts against code lines. Pure Node, <1s.
      - name: Guard — space-less launchers declare their path-jail root
        run: node tools/check-safety-roots-declared.mjs

      # Step Processors board guard (CONNECTORS-BUNDLE-1 follow-up, 2026-09-07). docs/EDITIONS.md's
      # `| SP-*` rows are GENERATED from inspecto-ui/src/app/inspecto/contracts/processor-catalog.contract.json
      # (itself written by ProcessorCatalogContractTest), plus the per-edition decisions the renderer holds
      # in code. The script has advertised a `--check` mode as CI-friendly since it was written, and nothing
      # ran it — so the board could drift from the catalog silently, which is the one thing generating it was
      # meant to prevent. It had in fact drifted by the time this step was added. Pure Node, ~instant; the
      # fix when it fails is `node tools/render-processor-board.mjs`, never a hand-edited `| SP-` row.
      - name: Guard — Step Processors board is generated, not hand-edited
        run: node tools/render-processor-board.mjs --check

      # Gate-tally guard (2026-09-07). BACKLOG §2 states its own arithmetic — "N of the M gates were RUN"
      # — and this refuses a build where that sentence disagrees with the table under it. It exists
      # because the sentence was wrong the day the section was rewritten to be checkable: it claimed
      # "13 of 15" over a 16-row table, having silently counted 4 rows nobody could check as gates that
      # hold. A number that looks like evidence and is not is invisible to every other guard here.
      # Pure Node, ~instant. Falsified in both directions (wrong total, wrong not-run count, a dropped
      # marker, a deleted sentence, and an unmatched table) before it was wired in.
      - name: Guard — BACKLOG §2's gate tally matches its table
        run: node tools/check-gate-tally.mjs

      # Family-count guard (2026-09-12). OperationalDb.Family's size is restated in NINE places outside
      # the enum — two test tripwires and seven sentences across three docs — and the hand sweep was
      # missed TWICE IN TWO SHIFTS (EVENTS took it 12->13, RUN_LEASE 13->14). The tripwires caught both,
      # but only after a ~14-minute reactor run, and they say nothing about the prose. Instant here.
      # Falsified in both directions (drifted prose, drifted tripwire) before it was wired in.
      - name: Guard — every stated OperationalDb.Family count matches the enum
        run: node tools/check-family-count.mjs

      # Doc-link guard (2026-09-08). ~1,380 relative links across the current doc tiers must resolve.
      # Added because nothing policed links at all: DOCS-LINKS-1 was a manual sweep, and the invariant had
      # rotted in four flavours by the time this ran — a module split (inspecto-engine -> inspecto-ops), a
      # class named in a doc that never existed under that name, a plan archived out from under a live
      # link, and seven `.claude/skills/*/SKILL.md` references off by one directory level, pointing the
      # agent that reads them at nothing. Broken links INSIDE docs/archived-documents/** are ignored (that
      # tier is never maintained, by CLAUDE.md policy); links pointing INTO it are not, and the exemption
      # plus its count is printed on every run. Pure Node, ~instant. Falsified in both directions before
      # wiring: a broken current link, the same link made valid, a broken archive-internal link, a current
      # link into a missing archive file, external/anchor targets, and the emptiness floor.
      - name: Guard — every relative doc link resolves
        run: node tools/check-doc-links.mjs

      # Citation guard (2026-09-09, SPEC-STALEREF-1). The link guard above only sees markdown links; the
      # commoner way a doc points at the tree is a backticked path or class name in PROSE, and nothing
      # checked those. The consolidation measured 23 stale citations by hand; this guard's first run found
      # 152 — 39 dead paths and 113 citations of types the 2026-08-31 Consignment rename retired, one of
      # them a release gate resting on `BatchGraphRunner`, a class that does not exist while
      # `ConsignmentGraphRunner` has two production callers. Nine capability specs' §8 sections described
      # running this check and, until now, said it existed only in a session scratchpad.
      # Its old-name set is PARSED from tools/rename-batch-to-consignment.mjs rather than mirrored here —
      # a hand-mirrored map drifts, which is one of the failure classes this guard closes. Two allow rules,
      # both printed with their counts on every run: a dead path is fine on a line that states the absence,
      # an old name is fine on a line that also names its replacement. Falsified in both directions before
      # wiring: a seeded dead path and a seeded bare old name each failed with their line number, each
      # allow-rule turned the same line green, the clean corpus passed, and a run from the wrong directory
      # FAILED on the emptiness floor rather than passing over nothing.
      - name: Guard — every cited path and type name exists
        run: node tools/check-doc-citations.mjs

      # Backlog owning-doc guard. The second half of the citation guard above: that one proves a `→`
      # target RESOLVES, this one proves the target says anything about the row pointing at it. Two
      # pointers were caught by hand aiming at documents that never mentioned their subject
      # (MEASURE-SHORTHAND-ONE-HOME-1 → catalog-vs-executors.md, DUCKLAKE-GRAPH-LANE-1 → db-layer.md)
      # and ~100 such pointers were unchecked. The subject compared is the row's IDENTIFIER, an exact
      # repo-coined token — deliberately NOT a prose/topic matcher, for the reason written at length in
      # tools/check-doc-counts.mjs: a prose scanner built here matched 14 lines over 238 docs, all of
      # them false, while missing the real phrasings. A guard that is mostly exemption is worse than no
      # guard. Exemptions: NONE. Its one scope limit — a row with no identifier has no exact subject —
      # is printed with every unverified pointer's line number on every run, pass or fail, because a
      # silent skip is an exemption by another name. `→` is also ordinary prose on that board, so the
      # parser reads a pointer-list grammar and keeps only `.md` targets: 24 of the 78 parsed targets
      # are Java symbols, properties or section tokens and are counted, not reported. Falsified in
      # three directions before wiring: the real corpus state reported, a legitimately homed row
      # repointed at a doc that does not name it went RED with its line number, and restoring it (plus
      # homing the three genuine findings) went green.
      - name: Guard — every BACKLOG `→` owning-doc pointer names its row
        run: node tools/check-backlog-homes.mjs

      # Doc-count guard (2026-09-09, SPEC-COUNTS-1). Six product counts were each stated several
      # ways — node types five ways, maintenance tasks five, job types four, processors three,
      # transform functions three — and in every case the narrative doc was wrong and the generated
      # one was right. The consolidation repaired the instances; nothing held them, because each
      # number is restated by hand in two to eight current documents. This guard makes every marked
      # statement DERIVED from the committed contract that owns it, parsed at run time.
      # 🔴 It is deliberately NOT a prose scanner. That design was built as a census first and
      # measured: over 238 current docs it matched 14 lines, whose "failures" were a line reference
      # (Roles.java:121-131), a sentence about one specific node type, and correction notes naming
      # the old figure on purpose — while MISSING real phrasings like "the 119-entry catalog". A
      # number in prose is indistinguishable from a line number or a version, so that guard would be
      # mostly exemption, the shape this repo has recorded as a failure three times over.
      # Job types and maintenance tasks are excluded on purpose: their totals are EDITION-dependent
      # (10 vs 12; 20 built-in + 4 contributed), so asserting one number would assert a falsehood.
      # Falsified in four directions before wiring: a hand-edited doc number failed with its
      # file:line; ADDING a processor to the contract failed all EIGHT of its statements at once;
      # deleting a marker failed the scope floor; a typo'd id failed as unknown; and the guard is
      # cwd-independent (ROOT resolves from the script path), while a run finding no files fails on
      # the floors rather than passing over nothing. ⚠ The floors are set EQUAL to the marked counts
      # — the first version left slack and a deleted marker went GREEN. ⚠ This comment said "six"
      # until it was re-measured against the committed tree: two markers had been wiped by a
      # `git checkout --` during falsification, so the first figure was taken from a smaller corpus.
      - name: Guard — every stated product count is derived from its contract
        run: node tools/check-doc-counts.mjs

      # Route-gating evidence (compliance plan 4e). The table in compliance/evidence/route-gating.md is
      # DERIVED from the route registrations; --check fails if the committed table has drifted from the
      # code, so the evidence document cannot say something the system does not. It also fails outright
      # on any mutating route that declares NO posture — the same hole the boot check closes at runtime.
      - name: Guard — the route-gating evidence table matches the code
        run: node tools/route-gating-report.mjs --check

      # NUL-byte guard (2026-09-10). Found while running scale-out spike S4: an agent reported one file
      # "drops out of a naive content grep"; measured, a recursive `rg -l --glob '*.java' 'SHARED'` over
      # the module listed three files and NOT the fourth, although that fourth declares `SHARED`. ripgrep
      # treats a file containing a NUL byte as binary and skips it when recursing — but still searches it
      # when the path is named, which is why spot-checking one file passes and the hole stays invisible.
      # Five tracked source files were affected (three Java, two TypeScript), six occurrences, every one a
      # separator character in a composite map key written as a raw 0x00 rather than the escape. This
      # repository reviews itself with grep, so this is a search-integrity guard, not a formatting one.
      # Falsified four ways: a NUL back into a tracked .java failed with file+line; a NUL in an UNTRACKED
      # file passed (the scope claim); a NUL appended to a tracked .png passed (the extension exemption);
      # the clean tree passed over 3,693 files.
      - name: Guard — no tracked text file contains a NUL byte
        run: node tools/check-nul-bytes.mjs

      # SBOM module-set guard (2026-09-09). tools/sbom.mjs built its first-party table from FOUR artifacts
      # under a comment claiming it was "the SAME table package.ps1 stages from". It was not, and had not
      # been since EDG-01: package.ps1 stages 11 jars for Standard and 12 for Enterprise, so every shipped
      # bill of materials under-declared its own bundle (4 first-party where Standard carries 10), and
      # javax.mail appeared in NO shipped SBOM at all after it moved to inspecto-notify-channels. The
      # documents ship INSIDE the signed, checksummed archive and the compliance matrix relies on them, yet
      # nothing could go red: there was no test over the generator and release.yml only copies its output.
      # This parses package.ps1's three independent enumerations ($modules, the Copy-Item staging steps, the
      # boot-smoke classpath), requires them to agree with each other and with tools/bundle-modules.mjs, and
      # checks each module's declared artifactId — a wrong dir→artifactId pair contributes ZERO components
      # for that module, silently. Pure Node, ~instant. Falsified in both directions before wiring: the
      # original 4-module table, a phantom module, a wrong artifactId, a newly staged jar, a dropped
      # boot-classpath entry, a restructured $modules, and a re-indented unconditional copy.
      - name: Guard — the shipped SBOM declares the jars the bundle stages
        run: node tools/check-sbom-modules.mjs

      # DuckDB extension guard (AIRGAP-EXTENSIONS-CI-1, 2026-09-14). Sibling of the guard above, and filed
      # for the same reason one layer down: package.ps1 stages extensions best-effort from a local cache and
      # only WARNS when it finds none, and nothing in CI populated one — so every released bundle, on every
      # platform, shipped an empty duckdb-extensions/, and AIRGAP-EXTENSIONS-1 was never actually delivered
      # by a release.
      # release.yml now populates the cache before packaging. ⛔ But that step runs ONLY on a `v*` tag, and
      # "a path that executes only at release time" is precisely the defect being fixed — so --check runs
      # here on every push: it re-reads $duckdbExtNames and the platform list OUT of package.ps1 and HEADs
      # every file the release would fetch. No download; the full fetch is ~160 MB and belongs on the tag.
      # Catches a drifted list, a renamed variable, and a duckdb bump whose extensions are not published for
      # that ABI — each of which would otherwise surface during a release. Falsified before wiring: renaming
      # $duckdbExtNames makes it exit 2 with the reason, not pass with an empty list.
      - name: Guard — every DuckDB extension the bundle stages is published for every platform
        run: node tools/fetch-duckdb-extensions.mjs --check

      # Launcher guard (LAUNCHER-GUARD-1, 2026-09-14). Third in the same family: package.ps1 emits the
      # deployment surface and nothing had ever EXECUTED any of it. serve.bat spent its life dropping
      # -Dauth.mode=oidc on every Windows Standard/Enterprise bundle — a parenthesised `if` block, which
      # cmd.exe expands ONCE at PARSE time, so five of six `set "OPTS=%OPTS% …"` statements were discarded
      # and the service booted AUTH-FREE while printing `edition: Enterprise` (SERVEBAT-OPTS-1, fixed
      # 2026-09-11; the gap was not). security.md §8.7 has listed "authMode ↔ enforcement coupling has no
      # test" for months.
      # This extracts the $serveShContent / $serveBatContent here-strings, writes them into throwaway
      # bundles holding stub jars for each edition, puts a stub `java` first on PATH, and RUNS the launcher
      # verbatim — asserting the argv it actually produced. ⚠ This job is Linux, so it executes serve.sh and
      # checks serve.bat statically; the `launchers-windows` job below executes serve.bat for real.
      - name: Guard — the emitted launchers hand the JVM their edition's flag set
        run: node tools/check-launchers.mjs

      # Bundle-platform guard (RELEASE-BUNDLE-PLATFORM-MISMATCH-1, 2026-09-17). The one zip a tag published
      # was compressed as 'windows_amd64' by a LITERAL at the call site while the jlink image on ubuntu-latest
      # is Linux — a Linux JVM beside Windows-only DuckDB extensions. package.ps1 now reads the platform off the
      # embedded image (Get-RuntimePlatform: java.exe vs an ELF `bin/java`); this parses package.ps1 and fails
      # on any literal -Platform at a compress call, any platform variable not assigned from that function, or
      # the function losing its image checks. Falsified three ways before wiring (see the file header).
      - name: Guard — the bundle's platform is read from the embedded runtime, never hard-coded
        run: node tools/check-bundle-platform.mjs

  test:
    runs-on: ubuntu-latest
    # DAT-6-CI-1 (2026-09-07). The embedded-Postgres harness was removed by operator decision — Postgres is
    # installed separately or pointed at — which left `PostgresStateStoreTest` reporting 11 SKIPPED and the
    # only proof that the JDBC stores run on real Postgres (chiefly `percentile_cont`, the one piece of
    # non-portable SQL) executing NOWHERE. A service container IS "an existing server", so this restores the
    # coverage without reversing the decision: no embedded engine, no per-platform binaries, just a URL.
    # ⚠ The test creates and drops its own schema per run, so a shared container is safe.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The optional inspecto-agent module now depends on eoiagent (com.eoiagent:*:0.2.0-SNAPSHOT —
      # the version the parent POM pins; this comment said 0.1.0-SNAPSHOT until 2026-08-28),
      # which replaced the discontinued agent-kernel. eoiagent is pre-release and not yet published to
      # GitHub Packages, so CI checks out its source (public repo jotder/inspect-agent) and installs it
      # into the runner's local ~/.m2 — the same thing a local dev does by hand. Once eoiagent cuts a
      # 0.1.0 release and starts publishing to GitHub Packages, swap this for a settings.xml repo/auth
      # step like the old agent-kernel one (see git history) and drop this checkout+build.
      #
      # ⛔ DELIBERATELY UNPINNED — do not add a `ref:` here (operator call, 2026-09-16). release.yml IS
      # pinned, and the asymmetry is the point: CI is the canary that catches upstream drift on the day it
      # lands, the release is the contract that has to be reproducible. Pinning both would hide drift until
      # release day, which is the expensive place to find it.
      # ⚠ This follows upstream's DEFAULT branch, which is `main` — the stray `master` that used to make
      # that ambiguous was deleted (verified 2026-09-16: refs/heads/main is the only branch).
      - name: Checkout eoiagent (jotder/inspect-agent, pre-release — no packages yet)
        uses: actions/checkout@v4
        with:
          repository: jotder/inspect-agent
          path: eoiagent-src

      - name: Build & install eoiagent into local .m2
        run: mvn --batch-mode --no-transfer-progress -DskipTests install
        working-directory: eoiagent-src

      # Build the whole reactor from the root POM so the optional agent module and
      # the cross-module AssistAgent SPI wiring are exercised, not just the core.
      # eoiagent resolves from the local .m2 build above.
      #
      # `install`, not `test` (2026-09-07): the dependency guard below shells its own
      # `mvn dependency:list`, a fresh session that resolves reactor SNAPSHOTs from `~/.m2` — and on a
      # clean runner nothing has been installed there, so it died with "Could not find artifact
      # com.gamma.asn:asn-core:0.1.0-SNAPSHOT" the first time it ever got to run. It had looked healthy
      # locally only because a developer's `~/.m2` is warm from past builds: a guard passing on
      # environment state rather than on the thing it checks. Installing here costs one shade pass and
      # makes the guard actually executable. See okf/backend/build-run/guard-coverage.md.
      #
      # `-Pedition-enterprise` (GUARD-SWEEP-1a, 2026-09-07): the profile is MODULES-ONLY — it adds
      # inspecto-security and inspecto-policy, which are absent from the default <modules> and were
      # therefore never built or tested by ANY workflow. That left 54 test methods running nowhere
      # automated: all OIDC authentication, token relay, ABAC policy enforcement and keystore-secret
      # resolution — the security-critical surface. `release.yml` does build Enterprise, but with
      # -DskipTests, so a compile break was caught at tag time and a test regression never was.
      # Enterprise is the superset, so this one flag covers Standard too, in the same reactor pass.
      #
      # `-Pcoverage` (GUARD-SWEEP-1g, 2026-09-08): jacoco had been configured for months behind this
      # profile and NO workflow activated it, so the repo had no coverage number at all — the "no coverage
      # gate anywhere" gap. It is REPORTING only: the profile binds prepare-agent + report and no `check`
      # goal, so this cannot fail a build. ⛔ A threshold is deliberately NOT set here — choosing what
      # number blocks whom is a policy decision, and the point of this step is to produce the data that
      # decision needs. Measured baseline 2026-09-08: instructions 81.01%, branches 67.19%, lines 80.88%
      # across 26 reporting modules (239572/295731 instructions).
      # ⚠ That is the HONEST figure. The first measurement said 82.92% across 21 modules, because the
      # asn-parser tree was never instrumented — a separate root POM, and a Maven profile is inherited
      # through <parent>, never through aggregation. Adding the profile there pulled the number DOWN by
      # ~1.9 points, mostly from asn-golden (4.4%) and asn-plugin-vendors (12.2%), whose tests are
      # environment-gated. ⚠ A module with ZERO tests writes no jacoco.exec and so vanishes from the
      # denominator rather than dragging it down — immaterial here (~800 lines across 4 modules) but the
      # reason the percentage is not a measure of "code with tests". See
      # okf/backend/build-run/guard-coverage.md.
      - name: Run tests (all editions) with coverage, and install so the dependency guard can resolve the reactor
        run: >-
          mvn --batch-mode --no-transfer-progress install -Pedition-enterprise -Pcoverage
          '-Dinspecto.test.pg.url=jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postgres'

      # Keep the reports so a trend is visible run-to-run — without this the number exists only in the
      # log and nobody can say whether it moved.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/'
          if-no-files-found: warn
          retention-days: 14

      # Repo-WIDE floors (operator decision 2026-09-08), summed across the per-module CSVs.
      # ⚠ Not `jacoco:check`: that goal binds per module, so it would gate every module on its own
      # number — inspecto-util (49.6%) and asn-golden (4.4%) would fail while the codebase as a whole
      # sits well above the floor. Summing is the only way to enforce ONE number.
      # ⚠ Absent reports FAIL rather than pass, so a build that lost `-Pcoverage` cannot slip through.
      - name: Coverage floors
        run: node tools/check-coverage.mjs --backend

      # Boundary law (U1): the lean ETL core never gains a kernel dependency. Kernel types live
      # ONLY in the optional inspecto-agent module, behind the AssistAgent SPI. This guard
      # makes that enforceable, not aspirational — it fails the build if a com.gamma.agentkernel
      # reference ever leaks into the lean core's sources or its resolved dependency tree.
      - name: Guard — lean core stays kernel-free
        run: |
          if grep -rEl "com\.gamma\.agentkernel" inspecto/src; then
            echo "::error::lean core (inspecto) must not reference com.gamma.agentkernel"; exit 1
          fi
          if mvn --batch-mode --no-transfer-progress -pl inspecto dependency:tree | grep -E "com\.gamma\.agentkernel"; then
            echo "::error::lean core (inspecto) must not depend on agent-kernel"; exit 1
          fi
          echo "OK: inspecto is kernel-free (sources + dependency tree)"

      # Dependency-review guard (compliance C4 / matrix gap G7). Diffs the RESOLVED runtime
      # dependency graph against the committed tools/dependencies.lock, so a dependency cannot
      # appear, vanish or change version without the lock moving in the same commit — which is what
      # makes it reviewable. The POMs pin what we ASK for; the lock pins what we actually GET, and a
      # sibling SNAPSHOT can move a transitive without any POM here changing a line.
      # ⛔ NOT a vulnerability scanner (offline by constraint — see the script header); do not cite
      # it to an auditor as vulnerability management. Runs AFTER the eoiagent install, because the
      # graph it resolves includes com.eoiagent:*.
      - name: Guard — dependency review (lockfile diff)
        run: node tools/check-dependencies.mjs

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  # serve.bat, EXECUTED (LAUNCHER-GUARD-1, 2026-09-14).
  # ⛔ This job exists because the `test` job cannot do it. SERVEBAT-OPTS-1 was a cmd.exe parsing rule —
  # a parenthesised block expands its variables once, at parse time — and no amount of reading, and no
  # Linux runner, can observe it. Windows is the one platform CI never exercised, which is exactly where
  # the auth-free bundle shipped from. The static half runs on Linux in the `test` job; only here does the
  # `.bat` prove anything.
  # Deliberately NOT folded into `test`: this needs no JDK, no Maven, no Postgres service and no eoiagent
  # checkout — it is pure Node over package.ps1 and finishes in seconds. Keeping it separate keeps the
  # Windows minutes at that, instead of duplicating a ~30-second reactor build on a 2× billed runner.
  launchers-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — serve.bat hands the JVM its edition's flag set (executed on Windows)
        run: node tools/check-launchers.mjs

# Note: CI does not build or store the fat JAR. It is ~90 MB (almost entirely
# DuckDB's per-platform native binaries) and would bloat Actions artifact
# storage on every tag for no benefit — the downloadable release JAR is built
# locally and attached to the GitHub release at cut time (see the release flow),
# not produced here.
