{{- $scheme := ternary "HTTPS" "HTTP" .Values.tls.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "inspecto.fullname" . }}
  labels: {{- include "inspecto.labels" . | nindent 4 }}
  annotations:
    inspecto/replica-safety: "single replica only - not multi-replica safe"
spec:
  # ⛔ Hard-coded, not a value: two pods would each own a private copy of the Spaces volume.
  replicas: 1
  serviceName: {{ include "inspecto.fullname" . }}
  selector:
    matchLabels: {{- include "inspecto.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "inspecto.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      # Non-root, matching the image's fixed uid/gid 10001; fsGroup makes the PVC writable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: inspecto
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # readOnlyRootFilesystem: proven 2026-09-29 by booting the image with `docker run --read-only`
          # and the demo Space (13 Pipelines) mounted — the app writes only /app/spaces (the PVC) and /tmp.
          # /tmp must be an EXEC-able emptyDir: DuckDB extracts its JNI .so there (a noexec tmpfs fails
          # with "failed to map segment from shared object").
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: SPACES_ROOT
              value: spaces
            {{- with .Values.javaOpts }}
            - name: INSPECTO_JAVA_OPTS
              value: {{ . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: HTTPS_KEYSTORE
              value: /app/tls/{{ .Values.tls.keystoreKey }}
            - name: HTTPS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tls.secretName }}
                  key: {{ .Values.tls.passwordKey }}
            {{- end }}
          {{- if or .Values.secrets.existingSecret .Values.secrets.values }}
          envFrom:
            - secretRef:
                name: {{ include "inspecto.secretName" . }}
          {{- end }}
          # Generous startup window (30 x 10 s = 5 min) so a slow first boot — many Spaces, a cold DuckDB
          # — is not killed by the liveness probe before it has started.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.port }}
              scheme: {{ $scheme }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.port }}
              scheme: {{ $scheme }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.port }}
              scheme: {{ $scheme }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: spaces
              mountPath: /app/spaces
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /app/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            items:
              - key: {{ .Values.tls.keystoreKey }}
                path: {{ .Values.tls.keystoreKey }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: spaces
      spec:
        accessModes: [{{ .Values.persistence.accessMode }}]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
