# Inspecto single-replica chart (ASSURE-OPERABILITY-1, 2026-09-29).
#
# ⛔ NOT MULTI-REPLICA SAFE. The StatefulSet is pinned to replicas: 1 in the template; there is no value
# to change it. Each pod keeps DuckDB files, Parquet and the Spaces tree on its own volume, and with the
# default run.lease.backend=heap, run exclusion is per process. Scale-out is the Enterprise partitioned
# topology (a pod owns Spaces, shared Postgres state, the DB run lease), which this chart does not implement.
#
# Image: build it from an unzipped inspecto-deploy bundle with the Dockerfile the bundle ships
# (`docker build -t <registry>/inspecto:<tag> .`) and push it to a registry the cluster can reach.
image:
  repository: inspecto
  # Empty = the chart appVersion. Set appVersion (or this) to the tag you built; never `latest`.
  tag: ""
  pullPolicy: IfNotPresent

port: 8080

persistence:
  # Mounted at /app/spaces (serve.sh's SPACES_ROOT). Holds all per-Space config and data.
  size: 20Gi
  storageClassName: ""
  accessMode: ReadWriteOnce

resources:
  requests: { cpu: "2", memory: 4Gi }
  limits: { memory: 8Gi }

# Extra JVM flags passed as INSPECTO_JAVA_OPTS (e.g. "-Xmx6g -Dobjects.backend=db").
javaOpts: ""

# Plain environment for serve.sh (CORS_ORIGIN, AUTH_OIDC_ISSUER, AUTH_OIDC_JWKS_URI, AUTH_OIDC_AUDIENCE ...).
env: {}

# Secret-backed environment, loaded with envFrom. Name an existing Secret (recommended), or let the chart
# create one from `secrets.values` (tests only: the values land in the release manifest).
secrets:
  existingSecret: ""
  values: {}
  # values:
  #   AUTH_OIDC_CLIENT_SECRET: "..."

# TLS terminates in the JVM (serve.sh HTTPS_KEYSTORE / HTTPS_KEYSTORE_PASSWORD). The named Secret must
# hold the keystore file under `keystoreKey` and its password under `passwordKey`.
tls:
  enabled: false
  secretName: inspecto-tls
  keystoreKey: keystore.p12
  passwordKey: keystore-password

probes:
  startup:   { path: /health, periodSeconds: 10, failureThreshold: 30 }
  liveness:  { path: /health, initialDelaySeconds: 0, periodSeconds: 20, failureThreshold: 3 }
  readiness: { path: /ready,  initialDelaySeconds: 0, periodSeconds: 10, failureThreshold: 3 }
