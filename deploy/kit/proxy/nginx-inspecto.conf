# nginx in front of Inspecto (DEPLOY-EXPOSURE-KIT-1). Copy to /etc/nginx/conf.d/inspecto.conf, replace every
# EDIT line, then `nginx -t && systemctl reload nginx`. Run `bash bin/preflight.sh` before the first start.
#
# What it does:
#   * ends TLS here and forwards plain HTTP to Inspecto on 127.0.0.1:8080. Start Inspecto with
#     INSPECTO_JAVA_OPTS="-Dcontrol.bind=127.0.0.1 -Dcontrol.trustedProxies=127.0.0.1" so nothing else can reach it.
#   * refuses /metrics and /health/details (with or without /api/v1 and a /spaces/<id> prefix) to every address
#     except the scraper networks you allow below. Inspecto serves both without sign-in by design; this is the fence.
#   * passes the console's live streams (Server-Sent Events) through unbuffered, and uploads up to 64 MB (the
#     largest body the server accepts: inbox uploads, App packages, Space promotion).
#
# Needs nginx 1.19.3 or later (proxy_cookie_flags). The plain-HTTP listener only redirects to HTTPS.

upstream inspecto {
    server 127.0.0.1:8080;          # EDIT if you changed PORT
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name inspecto.example.com;                     # EDIT
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name inspecto.example.com;                     # EDIT

    ssl_certificate     /etc/nginx/tls/inspecto.crt;      # EDIT: full chain
    ssl_certificate_key /etc/nginx/tls/inspecto.key;      # EDIT
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:inspecto:10m;
    ssl_session_timeout 1d;

    # One year; add `; includeSubDomains` only when every subdomain is HTTPS too.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Inspecto sets its own X-Content-Type-Options, frame and content-security headers (FrameHeaders.java), including
    # the embed routes that must stay frameable, so none of them is added here.

    client_max_body_size 64m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Read by Inspecto only when -Dcontrol.trustedProxies names this proxy; it then walks the list right to left,
    # so a value the client sent cannot pose as its address.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Inspecto marks its sign-in refresh cookie Secure only when it serves TLS itself; here TLS ends at nginx.
    proxy_cookie_flags ~ secure;
    proxy_read_timeout 300s;        # long exports and Job triggers

    # -- the fence --------------------------------------------------------------------------------------------
    # nginx matches regex locations in order, on the decoded path with duplicate slashes merged, so this one must
    # stay first. It covers /metrics, /metrics/acquisition, /api/v1/metrics, /api/v1/health/details and the
    # /api/v1/spaces/<id>/... forms of each.
    location ~* ^/(api/v1/)?(spaces/[^/]+/)?(metrics|health/details)(/|$) {
        allow 127.0.0.1;
        allow ::1;
        # allow 10.20.30.0/24;      # EDIT: your Prometheus or monitoring network
        deny all;
        proxy_pass http://inspecto;
    }

    # -- live streams (Server-Sent Events): notifications, the Signal ledger tail, the assistant -----------------
    location ~ ^/api/v1/(spaces/[^/]+/)?(notifications/stream|signals/stream|agent/sessions/.+/ask/stream)$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;      # the server sends a heartbeat on an idle stream
        proxy_pass http://inspecto;
    }

    location / {
        proxy_pass http://inspecto;
    }
}
